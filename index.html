<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Home Hub — Family</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
/* Home Hub — family design system (consolidated) */
:root{--rxs:9px;--ease:cubic-bezier(.22,1,.36,1);--mono:'JetBrains Mono', ui-monospace, monospace;--bg:#FAFAF7;--bg2:#F1F2F6;--surface:#FFFFFF;--s2:#F5F6FA;--border:#E8EAF0;--border-2:#D3D8E3;--text:#1F2433;--text2:#4E5568;--text3:#6B7285;--accent:#4F7DF3;--acc2:#7C9CF6;--accbg:#EAF0FE;--accent-ink:#2648A8;--green:#23A06F;--greenbg:#E2F6EC;--green-ink:#1A6E4C;--red:#DC5446;--redbg:#FDECEA;--red-ink:#A3342A;--yellow:#D9A21B;--yellowbg:#FFF5D6;--yellow-ink:#7A5A06;--r:18px;--rsm:12px;--rlg:22px;--sh-1:0 1px 2px rgba(31,36,51,.04),0 2px 10px rgba(31,36,51,.04);--sh-2:0 8px 24px -8px rgba(31,36,51,.16);--sh-3:0 24px 60px -16px rgba(31,36,51,.28);--font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;--serif:var(--font);--ink:#1F2433;--c-on:#1F2433}
[data-dark]{--bg:#14161C;--bg2:#1B1E26;--surface:#20232C;--s2:#272B35;--border:#323744;--border-2:#434A5A;--text:#EEF0F5;--text2:#BAC0CF;--text3:#959CAE;--accbg:#22305A;--accent-ink:#A9C0F8;--greenbg:#173326;--green-ink:#8FDDB8;--redbg:#3A1E1C;--red-ink:#F2A79F;--yellowbg:#3A2F12;--yellow-ink:#F2D27A}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px;border:2px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-thumb:hover{background:var(--border-2);background-clip:padding-box;border:2px solid transparent}
::selection{background:var(--accent);color:#fff}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;margin:14px 0 6px;background:color-mix(in oklab, var(--surface) 80%, transparent);backdrop-filter:saturate(140%) blur(14px);-webkit-backdrop-filter:saturate(140%) blur(14px);border:1px solid var(--border);border-radius:999px;position:sticky;top:14px;z-index:100;gap:12px;box-shadow:var(--sh-1)}
.topbar-date{font-size:.7rem;color:var(--text3);font-weight:600;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.topbar-time{font-family:var(--font);font-size:1.35rem;font-weight:400;color:var(--text);letter-spacing:-.02em;line-height:1;white-space:nowrap}
.bottomnav{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:color-mix(in oklab, var(--surface) 92%, transparent);backdrop-filter:saturate(140%) blur(14px);-webkit-backdrop-filter:saturate(140%) blur(14px);border:1px solid var(--border);display:flex;height:62px;z-index:100;border-radius:999px;box-shadow:var(--sh-2);padding:6px;gap:2px;width:auto;max-width:calc(100% - 28px)}
.card{background:var(--surface);border-radius:var(--r);border:1px solid var(--border);padding:20px;box-shadow:var(--sh-1)}
.sh{display:flex;align-items:center;justify-content:space-between;margin:24px 0 12px;gap:12px}
.btn-secondary:hover{background:var(--s2);border-color:var(--text2)}
.btn-lg{padding:14px 24px;font-size:.95rem;border-radius:14px}
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:.7rem;font-weight:600;letter-spacing:-.005em;background:var(--s2);color:var(--text2);border:1px solid var(--border)}
.fab{position:fixed;bottom:96px;right:22px;width:56px;height:56px;border-radius:50%;background:var(--text);color:var(--surface);border:none;font-size:24px;font-weight:300;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 28px -10px rgba(0,0,0,.4), 0 4px 10px -4px rgba(0,0,0,.2);z-index:200;transition:all .2s var(--ease)}
.fab:hover{transform:scale(1.06) translateY(-2px)}
.fab:active{transform:scale(.95)}
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:600;background:var(--s2)}
.modal-bg{position:fixed;inset:0;background:color-mix(in oklab, var(--text) 40%, transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:500;display:flex;align-items:flex-end;animation:fadeIn .2s ease}
@media(min-width:600px){
.modal-bg{align-items:center}
.modal{max-width:540px;margin:0 auto;border-radius:24px;border-bottom:1px solid var(--border);animation:scaleIn .25s var(--ease);box-shadow:var(--sh-3)}
}
.modal-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}
.modal-close{width:34px;height:34px;border-radius:50%;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.modal-close:hover{background:var(--s2);color:var(--text)}
.fgroup{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.ftextarea{resize:vertical;min-height:72px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:480px){
.frow{grid-template-columns:1fr}
}
.pill-select{display:flex;flex-wrap:wrap;gap:6px}
.ps-pill:hover{border-color:var(--text2);color:var(--text)}
.day-btn{width:42px;height:42px;border-radius:50%;border:1px solid var(--border);background:transparent;color:var(--text2);font-size:.74rem;font-weight:700;cursor:pointer;transition:all .15s}
.day-btn:hover{border-color:var(--text2);color:var(--text)}
.day-btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.panel-bg{position:fixed;inset:0;background:color-mix(in oklab, var(--text) 35%, transparent);z-index:400;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(360px,92vw);background:var(--surface);z-index:401;overflow-y:auto;box-shadow:-20px 0 60px -20px rgba(0,0,0,.25);animation:slideInR .3s var(--ease);display:flex;flex-direction:column;border-left:1px solid var(--border)}
.panel-hdr{padding:22px 22px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.panel-body{padding:18px 22px}
.ucard:hover{border-color:var(--text2);transform:translateY(-1px);box-shadow:var(--sh-1)}
.ucard.active-user{border-color:var(--accent);background:var(--accbg)}
.pin-dots{display:flex;gap:14px;justify-content:center}
.pin-dot{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--border-2);background:transparent;transition:all .15s}
.pin-dot.on{background:var(--accent);border-color:var(--accent)}
.pin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:240px;margin:0 auto}
.pin-key:hover{background:var(--surface);transform:scale(1.04);border-color:var(--text2)}
.pin-key:active{transform:scale(.94)}
.hero{position:relative;margin:8px 0 18px;padding:32px 28px 28px;border-radius:var(--rlg);background:radial-gradient(600px 300px at 100% 0%, color-mix(in oklab, var(--accent) 18%, transparent), transparent 70%),
    var(--surface);border:1px solid var(--border);box-shadow:var(--sh-1);overflow:hidden}
.sky-member-chips{display:flex;gap:8px;overflow-x:auto;padding:8px 0 4px;scrollbar-width:none}
.sky-member-chips::-webkit-scrollbar{display:none}
.sky-chip:hover{border-color:var(--text2);color:var(--text)}
.sky-chip.active{border-color:transparent}
.sky-week-header{display:grid;gap:0;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);z-index:5}
.sky-day-hdr{text-align:center;padding:10px 4px 8px;border-right:1px solid var(--border)}
.sky-day-hdr:last-child{border-right:none}
.sky-day-num.today{background:var(--accent);color:#fff}
.sky-day-num:hover:not(.today){background:var(--s2)}
.sky-grid-wrap{display:flex;overflow-y:visible;position:relative}
.sky-time-col{width:52px;min-width:52px;flex-shrink:0}
.sky-day-cols{display:grid;flex:1;border-top:1px solid var(--border)}
.sky-day-col{border-right:1px solid var(--border);position:relative;min-width:0}
.sky-day-col:last-child{border-right:none}
.sky-hour-row{border-bottom:1px solid var(--border);position:relative}
.sky-hour-row::after{content:'';position:absolute;left:0;right:0;top:50%;border-bottom:1px dashed var(--border);opacity:.5}
.sky-event:hover{transform:translateY(-1px);box-shadow:0 6px 16px -8px rgba(0,0,0,.2);z-index:3}
.sky-allday-row{display:grid;gap:0;border-bottom:1px solid var(--border);background:var(--s2)}
.sky-allday-cell{padding:4px 5px;border-right:1px solid var(--border);min-height:24px}
.sky-allday-cell:last-child{border-right:none}
.sky-now-line{position:absolute;left:0;right:0;z-index:4;height:1.5px;background:var(--accent);pointer-events:none}
.sky-now-line::before{content:'';position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 3px color-mix(in oklab, var(--accent) 25%, transparent)}
@media(max-width:540px){
.sky-week-header,.sky-day-cols{grid-template-columns:repeat(3,1fr)!important}
.sky-day-hdr:nth-child(n+5),.sky-day-col:nth-child(n+4){display:none}
}
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cal-nav-btn{background:none;border:1px solid var(--border);width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:1rem;color:var(--text2);transition:all .15s;display:flex;align-items:center;justify-content:center}
.cal-nav-btn:hover{color:var(--text);border-color:var(--text2)}
.month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.month-hdr{text-align:center;font-size:.65rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--text3);padding:6px 0}
.month-day:hover{background:var(--s2);border-color:var(--text2)}
.month-day.today{border-color:var(--accent);background:var(--accbg)}
.month-day.other-month{opacity:.35}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;height:80vh;gap:16px}
.loading-ico{font-size:2.6rem;animation:pulse 1.4s ease infinite}
#confetti-canvas{position:fixed;inset:0;z-index:9999;pointer-events:none;display:none}
.setting-label{font-weight:600;font-size:.92rem}
.setting-val{font-size:.78rem;color:var(--text3);margin-top:2px}
.toggle{width:46px;height:26px;border-radius:99px;background:var(--border);position:relative;cursor:pointer;border:none;transition:background .2s;flex-shrink:0}
.toggle::after{content:'';position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;top:3px;left:3px;transition:transform .2s var(--ease);box-shadow:0 1px 4px rgba(0,0,0,.2)}
.toggle.on::after{transform:translateX(20px)}
.empty{text-align:center;padding:56px 24px;color:var(--text3)}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes scaleIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
@keyframes slideInR{from{transform:translateX(100%)}to{transform:translateX(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes bounce{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
@keyframes checkPop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}
.anim-in{animation:slideUp .35s var(--ease) both}
body{min-height:100vh;overflow-x:hidden;background-attachment:fixed;font-family:var(--font);background:var(--bg);color:var(--text);letter-spacing:0;font-feature-settings:normal}
a{color:var(--accent-ink)}
a:hover{color:var(--accent)}
.hh-ico{display:inline-flex;line-height:0;flex-shrink:0}
.sh-title{font-family:var(--font);color:var(--text);display:flex;align-items:center;gap:8px;font-size:1.25rem;font-weight:800;letter-spacing:-.01em}
.modal-title{font-family:var(--font);letter-spacing:-.01em;font-size:1.3rem;font-weight:800}
.panel-title{font-family:var(--font);letter-spacing:-.01em;font-size:1.2rem;font-weight:800}
.pin-key{aspect-ratio:1;border-radius:14px;border:1px solid var(--border);font-family:var(--font);color:var(--text);cursor:pointer;transition:all .12s var(--ease);display:flex;align-items:center;justify-content:center;font-size:1.4rem;font-weight:700;background:var(--surface);min-height:56px}
.sky-day-num{width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-family:var(--font);cursor:pointer;transition:all .2s var(--ease);font-size:1.05rem;font-weight:800}
.cal-nav-title{font-family:var(--font);font-size:1.2rem;font-weight:800}
.mday-num{font-family:var(--font);margin-bottom:3px;font-size:.9rem;font-weight:800}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border:1px solid transparent;font-size:.85rem;letter-spacing:-.005em;cursor:pointer;transition:all .2s var(--ease);white-space:nowrap;min-height:44px;font-weight:700;border-radius:14px}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 8px 20px -10px color-mix(in oklab,var(--accent) 70%,transparent)}
.btn-secondary{color:var(--text);border:1px solid var(--border);background:var(--surface)}
.ps-pill{padding:7px 14px;border-radius:999px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;transition:all .2s var(--ease);min-height:40px;font-size:.85rem;font-weight:700}
.ps-pill.on{background:var(--accent);border-color:var(--accent);color:#fff}
.finput,.fselect,.ftextarea{width:100%;padding:12px 14px;border:1px solid var(--border);color:var(--text);font-family:inherit;outline:none;transition:all .15s;min-height:46px;font-size:.95rem;background:var(--surface);border-radius:12px}
.finput:focus,.fselect:focus,.ftextarea:focus{background:var(--surface);border-color:var(--accent);box-shadow:0 0 0 3px var(--accbg)}
.flabel{font-weight:700;color:var(--text2);text-transform:uppercase;font-size:.78rem;letter-spacing:.04em}
.toggle.on{background:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);padding:13px 22px;border-radius:999px;font-size:.88rem;z-index:600;animation:slideUp .25s var(--ease);white-space:nowrap;box-shadow:var(--sh-3);pointer-events:none;background:var(--text);color:var(--surface);font-weight:700;bottom:104px}
.setting-row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--surface);border:1px solid var(--border);margin-bottom:7px;border-radius:16px;min-height:60px}
.ucard{display:flex;align-items:center;gap:14px;padding:14px;border:1px solid var(--border);background:var(--surface);cursor:pointer;margin-bottom:8px;transition:all .2s var(--ease);min-height:64px;border-radius:16px}
.sky-chip{display:flex;align-items:center;border-radius:999px;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--text2);white-space:nowrap;transition:all .2s var(--ease);min-height:40px;padding:4px 14px 4px 4px;font-size:.88rem;font-weight:700;gap:8px}
.sky-chip:first-child{padding-left:14px}
.sky-event{position:absolute;left:3px;right:3px;font-size:.7rem;overflow:hidden;cursor:pointer;transition:all .15s var(--ease);z-index:2;border:1px solid transparent;border-radius:10px;padding:6px 8px;border-top:none;border-right:none;border-bottom:none}
.sky-day-name{font-weight:700;text-transform:uppercase;color:var(--text3);letter-spacing:.1em;margin-bottom:4px;font-size:.7rem}
.sky-time-label{display:flex;align-items:flex-start;justify-content:flex-end;padding-right:10px;padding-top:4px;font-weight:600;color:var(--text3);border-right:1px solid var(--border);letter-spacing:.04em;font-size:.68rem}
.sky-event-av{position:absolute;bottom:5px;right:5px;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:9px;background:rgba(255,255,255,.8)!important;color:var(--ink)}
.month-day{border:1px solid var(--border);background:var(--surface);padding:6px;cursor:pointer;transition:all .2s var(--ease);border-radius:12px;min-height:78px}
#app{display:flex;flex-direction:column;margin:0 auto;max-width:1320px;padding:0 20px;min-height:100vh}
#content{flex:1;overflow-y:auto;padding-bottom:104px;padding:4px 0 128px}
.hh-brand{display:flex;align-items:center;gap:12px;min-width:0}
.hh-mark{width:46px;height:46px;border-radius:14px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.hh-brand-sub{font-size:.72rem;font-weight:800;color:var(--text3);letter-spacing:.08em;text-transform:uppercase}
.hh-family{font-size:1.35rem;font-weight:800;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hh-when{justify-self:center;text-align:center}
.hh-date{font-size:.95rem;font-weight:600;color:var(--text2);white-space:nowrap}
.hh-time{font-size:2rem;font-weight:800;letter-spacing:-.02em;line-height:1.1;white-space:nowrap}
.hh-hright{display:flex;justify-content:flex-end;align-items:center;gap:8px;flex-wrap:nowrap;min-width:0}
.hh-avstack .hh-av{margin-left:-8px;box-shadow:0 0 0 2px var(--surface)}
.hh-avstack .hh-av:first-child{margin-left:0}
.hh-av.on{position:relative;z-index:1;box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent)}
.hh-who{display:none}
.hh-av{border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0;border:2.5px solid;letter-spacing:.02em;line-height:1}
.hh-ibtn:hover{color:var(--text);box-shadow:var(--sh-2)}
.hh-ibtn.on{background:var(--accbg);color:var(--accent-ink);border-color:transparent}
.hh-parent:hover{color:var(--text);box-shadow:var(--sh-2)}
.hh-add{height:48px;padding:0 20px;border-radius:14px;border:none;background:var(--accent);color:#fff;font-weight:800;font-size:.98rem;display:inline-flex;align-items:center;gap:6px;box-shadow:0 8px 18px -8px color-mix(in oklab,var(--accent) 70%,transparent);transition:transform .12s}
.hh-add:hover{transform:translateY(-1px)}
.hh-add:active{transform:scale(.97)}
@media(max-width:1180px){
.hh-who{display:none}
.hh-avstack{padding-right:6px}
}
@media(max-width:1340px){
.hh-header{grid-template-columns:minmax(0,1fr) auto}
.hh-when{grid-column:1/-1;grid-row:2;justify-self:start;text-align:left;display:flex;align-items:baseline;gap:12px}
.hh-time{font-size:1.4rem}
}
@media(max-width:760px){
.hh-avstack{display:none}
}
@media(max-width:900px){
.hh-header{grid-template-columns:minmax(0,1fr) auto}
.hh-when{grid-column:1/-1;grid-row:2;text-align:left;display:flex;align-items:baseline;gap:12px}
.hh-time{font-size:1.4rem}
.hh-parent .lbl{display:none}
.hh-parent{padding:0;width:48px;justify-content:center}
}
.hh-nav{position:fixed;z-index:120;background:var(--surface);border:1px solid var(--border);box-shadow:var(--sh-2);display:flex}
@media(max-width:1023px){
.hh-nav{left:12px;right:12px;bottom:12px;border-radius:22px;padding:6px;justify-content:space-around;padding-bottom:calc(6px + env(safe-area-inset-bottom))}
}
.hh-navi{flex:1;max-width:120px;min-height:58px;border:none;background:none;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--text3);font-size:.78rem;font-weight:700;transition:background .15s,color .15s}
@media(min-width:1024px){
#app{padding-left:124px;padding-right:32px}
#content{padding-bottom:56px}
.toast{bottom:32px}
.hh-nav{left:16px;top:16px;bottom:16px;width:88px;border-radius:24px;flex-direction:column;align-items:center;justify-content:center;padding:14px 8px;gap:8px}
.hh-navi{flex:0 0 auto;width:72px;height:72px}
}
.hh-navi:hover{color:var(--text);background:var(--s2)}
.hh-navi.on{color:var(--accent-ink);background:var(--accbg)}
.hh-sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.hh-link{background:none;border:none;color:var(--accent-ink);font-weight:700;font-size:.92rem;display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:0 10px;border-radius:12px;transition:background .15s}
.hh-link:hover{background:var(--accbg)}
.hh-page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:8px 0 18px}

}

.hh-stars-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}

.hh-goal-t{font-size:1.05rem;font-weight:800}
.hh-goal-n{font-size:.86rem;color:var(--text2);font-weight:600}

.hh-goals,.hh-recent{display:flex;flex-direction:column;gap:8px}

.hh-recent-s{font-size:.85rem;color:var(--text3);font-weight:600}

.hh-kid-stars .s{font-size:.86rem;font-weight:700;color:#4E5568}

:root[data-theme="sky"]{--accent:#4F7DF3;--acc2:#7C9CF6;--accbg:#EAF0FE;--accent-ink:#2648A8;--bg:#FAFAF7;--bg2:#F1F2F6;--s2:#F5F6FA;--border:#E8EAF0}

:root[data-theme="meadow"]{--accent:#2E9A6A;--acc2:#5BB98D;--accbg:#E1F4EA;--accent-ink:#1A6446;--bg:#F7FBF7;--bg2:#EAF3EC;--s2:#F1F8F3;--border:#DCEAE0}

:root[data-theme="ocean"]{--accent:#1E88B8;--acc2:#53A9D1;--accbg:#E0F2FA;--accent-ink:#135F82;--bg:#F6FBFD;--bg2:#E8F2F7;--s2:#F0F7FA;--border:#D9E8EF}

:root[data-theme="cocoa"]{--accent:#8A6447;--acc2:#AA8669;--accbg:#F2E8DF;--accent-ink:#5A3D28;--bg:#FBF8F4;--bg2:#F1EBE3;--s2:#F7F2EC;--border:#E7DED2}

:root[data-theme="rainbow"] body::before{content:'';position:fixed;top:0;left:0;right:0;height:5px;z-index:200;background:linear-gradient(90deg,#E8604F 0 16.6%,#E27A3C 0 33.3%,#E5A12E 0 50%,#23A06F 0 66.6%,#4F7DF3 0 83.3%,#8A68DB 0)}

:root[data-theme="rainbow"] .hh-navi:nth-child(2).on{background:#FFF5DC;color:#80560A}

:root[data-theme="rainbow"] .hh-navi:nth-child(4).on{background:#EAF0FE;color:#2648A8}

[data-dark][data-theme]{--bg:#14161C;--bg2:#1B1E26;--s2:#272B35;--border:#323744;--accbg:color-mix(in oklab,var(--accent) 24%,#20232C);--accent-ink:color-mix(in oklab,var(--accent) 50%,#fff)}
.hh-theme-row{flex-direction:column;align-items:stretch;gap:14px;padding:16px}
.hh-themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px}
.hh-theme{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:8px 8px 12px;border-radius:18px;border:1.5px solid var(--border);background:var(--surface);text-align:left;transition:transform .15s,box-shadow .15s,border-color .15s}

// Always use LOCAL date — never toISOString() which gives UTC date
function localDateStr(d){
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,'0');
  const day=String(d.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+day;
}
function todayStr(){ return localDateStr(new Date()); }

// Normalize any date value from Google Sheets to YYYY-MM-DD string
function normDate(val){
  if(!val || val==='') return '';
  const s = String(val).trim();
  // Already correct YYYY-MM-DD
  if(/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  // ISO with time "2026-05-07T..." — extract date part directly (no Date object needed)
  if(/^\d{4}-\d{2}-\d{2}T/.test(s)) return s.slice(0,10);
  // Sheets US format "5/7/2026" or "05/07/2026"
  const usMatch = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(usMatch) return usMatch[3]+'-'+usMatch[1].padStart(2,'0')+'-'+usMatch[2].padStart(2,'0');
  // Sheets dashed format "2026/05/07"
  const dashMatch = s.match(/^(\d{4})\/(\d{2})\/(\d{2})$/);
  if(dashMatch) return dashMatch[1]+'-'+dashMatch[2]+'-'+dashMatch[3];
  // Last resort: parse and use LOCAL date (not UTC)
  try {
    const d = new Date(s);
    if(!isNaN(d.getTime())) return localDateStr(d);
  } catch(e){}
  return s;
}

// Normalize a time value to HH:MM string
function normTime(val){
  if(!val || val==='') return '';
  const s = String(val).trim();
  // Already HH:MM or HH:MM:SS
  if(/^\d{1,2}:\d{2}/.test(s)) return s.slice(0,5);
  // ISO with time component
  if(/T\d{2}:\d{2}/.test(s)) return s.replace(/.*T(\d{2}:\d{2}).*/,'$1');
  return s;
}

const API = {

  async call(params) {
    if (CONFIG.DEMO_MODE) return null;
    const url = CONFIG.SCRIPT_URL + '?' + new URLSearchParams(params);
    const res = await fetch(url);
    if (!res.ok) throw new Error('Network error: ' + res.status);
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || 'API error');
    return json.data;
  },
  async post(body) {
    if (CONFIG.DEMO_MODE) return null;

    const url = CONFIG.SCRIPT_URL + '?payload=' + encodeURIComponent(JSON.stringify(body));

    if (!res.ok) throw new Error('Network error: ' + res.status);
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || 'API error');
    return json.data;
  },
  async readAll() {
    if (CONFIG.DEMO_MODE) return { ...DEMO };
    const data = await this.call({ action:'readAll' });
    // normalize booleans from sheet
    if (data.users) data.users.forEach(u => u.active = u.active === true || u.active === 'TRUE');
    if (data.routines) data.routines.forEach(r => r.active = r.active === true || r.active === 'TRUE');
    if (data.rewards) data.rewards.forEach(r => r.points = Number(r.points)||0);
    if (data.tasks) data.tasks.forEach(t => {
      t.reward_points = Number(t.reward_points)||0;

      t.completed_at= t.completed_at? String(t.completed_at): '';
    });
    if (data.events) data.events.forEach(e => {
      e.start_date = normDate(e.start_date);
      e.end_date   = normDate(e.end_date);
      e.start_time = normTime(e.start_time);
      e.end_time   = normTime(e.end_time);
    });
    return data;

    if (CONFIG.DEMO_MODE) {
      const t=DEMO.tasks.find(t=>t.task_id===id);
      if(t){
        t.status='completed';
        t.completed_at=new Date().toISOString();
        t.completed_by=by;
        t.completed_by_name=byName;
        if(t.reward_points>0) DEMO.rewards.push({reward_id:'rw'+Date.now(),user_id:t.assigned_to,points:t.reward_points,reason:t.title,date:todayStr(),by:byName});
      } return t;
    }
    return this.post({ action:'complete', id, completed_by:by, completed_by_name:byName });
  },
  async reopenTask(id) {
    if (CONFIG.DEMO_MODE) { const t=DEMO.tasks.find(t=>t.task_id===id); if(t){t.status='pending';t.completed_at='';t.completed_by='';t.completed_by_name='';} return t; }
    return this.post({ action:'reopen', id });
  },
  async addTasksBulk(tasks) {
    if (CONFIG.DEMO_MODE) {
      tasks.forEach(t=>{ t.task_id='t'+Date.now()+Math.random().toString(36).slice(2,6); DEMO.tasks.push(t); });
      return tasks;
    }
    return this.post({ action:'addBulk', sheet:'tasks', data:tasks });
  },
  async addEvent(ev) {
    if (CONFIG.DEMO_MODE) { ev.event_id='ev'+Date.now(); DEMO.events.push(ev); return ev; }
    return this.post({ action:'add', sheet:'events', data:ev });
  },
  async deleteEvent(id) {
    if (CONFIG.DEMO_MODE) { DEMO.events=DEMO.events.filter(e=>e.event_id!==id); return; }
    return this.post({ action:'delete', sheet:'events', id });
  },
};

function fmt12(t){
  if(!t)return'';
  try{
    const [h,m]=t.split(':').map(Number);
    const ampm=h>=12?'PM':'AM';
    const h12=h%12||12;
    return `${h12}:${String(m).padStart(2,'0')} ${ampm}`;
  }catch{return t}
}
function fmtDate(s){
  if(!s)return'';
  const clean = normDate(String(s));
  if(!clean) return '';
  // Use T12:00:00 (local noon) to avoid DST edge cases shifting the day
  const d = new Date(clean+'T12:00:00');
  if(isNaN(d.getTime())) return String(s);
  return d.toLocaleDateString([],{month:'short',day:'numeric'});
}
function isOverdue(t){
  if(t.status==='completed')return false;
  const td=todayStr();
  const dd=normDate(t.due_date);
  if(!dd) return false;
  if(dd<td)return true;
  if(dd===td&&t.due_time){
    const now=new Date();
    const tm=normTime(t.due_time);
    if(!tm) return false;
    const[h,m]=tm.split(':').map(Number);
    const due=new Date();due.setHours(h,m,0,0);
    return now>due;
  }
  return false;
}
function getUser(id){ return S.users.find(u=>u.user_id===id) }
function userPoints(uid){ return S.rewards.filter(r=>r.user_id===uid).reduce((s,r)=>s+(Number(r.points)||0),0) }


// ═══════════════════════════════════════════════════════════════
// RENDER ENGINE — simple vdom-lite
// ═══════════════════════════════════════════════════════════════
function r(sel='div', attrs={}, ...children){
  const el = document.createElement(sel);
  for(const [k,v] of Object.entries(attrs)){
    if(k==='class'){ el.className=v; continue }
    if(k==='style'&&typeof v==='object'){ for(const [sk,sv] of Object.entries(v)){ if(sk.startsWith('--')) el.style.setProperty(sk,sv); else el.style[sk]=(typeof sv==='number'&&!/^(opacity|zIndex|fontWeight|flex|flexGrow|flexShrink|lineHeight|order)$/.test(sk))?sv+'px':sv; } continue }
    if(k.startsWith('on')){ el.addEventListener(k.slice(2).toLowerCase(),v); continue }
    if(k==='html'){ el.innerHTML=v; continue }
    el.setAttribute(k,v);
  }
  for(const ch of children.flat(Infinity)){
    if(ch==null||ch===false)continue;
    el.appendChild(typeof ch==='string'||typeof ch==='number' ? document.createTextNode(String(ch)) : ch);
  }
  return el;
}
function txt(s){ return document.createTextNode(String(s)) }
function el(tag,cls,inner=''){
  const e=document.createElement(tag);
  if(cls)e.className=cls;
  if(inner)e.innerHTML=inner;
  return e;
}

function mount(id, node){
  const target=document.getElementById(id);
  if(!target)return;
  target.innerHTML='';
  if(node) target.appendChild(node);
}

function showToast(msg, ok=true){
  if(S.toastTimer) clearTimeout(S.toastTimer);
  const t=el('div','toast');
  t.textContent=(ok?'✅ ':'❌ ')+msg;
  if(!ok) t.style.background='var(--red)';
  mount('toast-mount',t);
  S.toastTimer=setTimeout(()=>mount('toast-mount',null),2600);
}

// ═══════════════════════════════════════════════════════════════
// CONFETTI
// ═══════════════════════════════════════════════════════════════
function launchConfetti(){
  const canvas=document.getElementById('confetti-canvas');
  if(!canvas)return;
  canvas.style.display='block';
  canvas.width=window.innerWidth; canvas.height=window.innerHeight;
  const ctx=canvas.getContext('2d');
  const colors=['#FF6B6B','#FFD93D','#6BCB77','#4D96FF','#FF922B','#CC5DE8'];
  const parts=Array.from({length:100},()=>({
    x:Math.random()*canvas.width,y:-10-Math.random()*30,
    r:5+Math.random()*7,d:2+Math.random()*2.5,
    color:colors[Math.floor(Math.random()*colors.length)],
    angle:Math.random()*Math.PI*2,ai:0.04+Math.random()*0.02,
    tilt:0,ti:0.06+Math.random()*0.04,
  }));
  let frame=0;
  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    parts.forEach(p=>{
      ctx.beginPath();ctx.fillStyle=p.color;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.tilt);
      Math.random()>.5?ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r):(ctx.arc(0,0,p.r/2,0,2*Math.PI),ctx.fill());
      ctx.restore();
      p.angle+=p.ai; p.tilt=Math.sin(p.ti+=p.ti)*10;
      p.y+=Math.cos(p.angle)+p.d; p.x+=Math.sin(p.angle)*1.2;
    });
    if(++frame<110) requestAnimationFrame(draw);
    else { canvas.style.display='none'; ctx.clearRect(0,0,canvas.width,canvas.height); }
  }
  draw();
}

// SIDE PANEL — user login
// ═══════════════════════════════════════════════════════════════
function renderPanel(){
  if(!S.showPanel){ mount('panel-mount',null); S._pinUser=null; S._pinVal=''; S._pinShake=false; return; }

  // ── Panel state at module level so it survives re-renders ──
  if(!S._pinVal)   S._pinVal='';
  if(!S._pinShake) S._pinShake=false;
  // S._pinUser is set when a parent card is tapped

  function updateDots(){
    document.querySelectorAll('#pin-dot-area .pin-dot').forEach((d,i)=>{
      d.className='pin-dot'+(i<S._pinVal.length?' on':'');
      if(S._pinShake){ d.style.borderColor='var(--red)'; if(i<S._pinVal.length) d.style.background='var(--red)'; }
      else { d.style.borderColor=''; d.style.background=''; }
    });
  }

  function pressKey(k){
    if(S._pinVal.length>=4) return;
    S._pinVal += String(k);
    updateDots();
    if(S._pinVal.length===4){
      const u = S._pinUser;
      // Always coerce to string — Google Sheets may return pin as a number
      const rawPin = (u && u.pin !== undefined && u.pin !== null && u.pin !== '') ? u.pin : null;
      const correct = rawPin ? String(rawPin).trim() : String(CONFIG.ADMIN_PIN).trim();
      console.log('[PIN] entered:', S._pinVal, '| correct:', correct, '| match:', S._pinVal===correct);
      if(S._pinVal===correct){
        // 1. Clear PIN state first
        S._pinVal=''; S._pinUser=null; S._pinShake=false;
        // 2. Close panel before any re-render
        S.showPanel=false;
        mount('panel-mount', null);
        // 3. Update user state
        S.currentUser=u;
        S.isAdmin=(u.role==='parent');
        // 4. Re-render everything fresh
        renderAll();
        showToast('Welcome, '+u.name+'! 👑');
      } else {
        S._pinShake=true; updateDots();
        setTimeout(()=>{ S._pinVal=''; S._pinShake=false; updateDots(); }, 600);
      }
    }
  }

  function showUserList(){
    const body=document.getElementById('panel-body');
    if(!body) return;
    body.innerHTML='';
    const title=document.getElementById('panel-title');
    if(title) title.textContent="Who's here?";
    S._pinUser=null; S._pinVal='';

    S.users.forEach(u=>{
      const card=r('div',{
        class:'ucard'+(S.currentUser?.user_id===u.user_id?' active-user':''),
        onClick:()=>{
          if(u.role==='parent'){ S._pinUser=u; S._pinVal=''; showPinPad(); }
          else { selectUser(u); }
        }
      },
        avatarEl(u,44),
        r('div',{style:{flex:'1'}},
          r('div',{style:{fontWeight:800,fontSize:'.9rem'}},u.name),
          r('div',{style:{fontSize:'.72rem',color:'var(--text3)'}},u.role==='parent'?'👑 Parent · 🔐 PIN':'⭐ Child')
        ),
        S.currentUser?.user_id===u.user_id?r('div',{style:{width:8,height:8,borderRadius:'50%',background:u.color}}):null,
        (u.role==='parent'&&S.currentUser?.user_id!==u.user_id)?r('span',{style:{opacity:.45,fontSize:13}},'🔐'):null
      );
      body.appendChild(card);
    });
    if(S.currentUser){
      body.appendChild(r('button',{
        class:'btn btn-secondary',style:{width:'100%',marginTop:8,fontSize:'.82rem'},
        onClick:()=>{ S.currentUser=null;S.isAdmin=false;S._pinUser=null;S._pinVal='';S.showPanel=false;mount('panel-mount',null);renderAll(); }
      },'🚪 Sign Out'));
    }
  }

  function showPinPad(){
    const body=document.getElementById('panel-body');
    if(!body) return;
    body.innerHTML='';
    const title=document.getElementById('panel-title');
    if(title) title.textContent='🔐 '+S._pinUser.name;
    S._pinVal=''; S._pinShake=false;

    const av=r('div',{style:{
      width:56,height:56,fontSize:28,margin:'4px auto 0',
      color:S._pinUser.color,borderColor:S._pinUser.color,
      background:S._pinUser.color+'22',
      display:'flex',alignItems:'center',justifyContent:'center',
      borderRadius:'50%',border:'2px solid '+S._pinUser.color
    }},initials(S._pinUser));

    const dotsWrap=r('div',{id:'pin-dot-area',class:'pin-dots'},
      ...[0,1,2,3].map(()=>r('div',{class:'pin-dot'}))
    );

    // Keys built ONCE — they call pressKey which reads S._pinVal
    const keyDefs=[1,2,3,4,5,6,7,8,9,'back',0,'cancel'];
    const grid=r('div',{class:'pin-grid'},
      ...keyDefs.map(k=>r('button',{class:'pin-key',
        onClick:()=>{
          if(k==='back'){ S._pinVal=S._pinVal.slice(0,-1); updateDots(); }
          else if(k==='cancel'){ S._pinUser=null; S._pinVal=''; showUserList(); }
          else pressKey(k);
        }
      },k==='back'?'⌫':k==='cancel'?'✕':String(k)))
    );

    const backBtn=r('button',{
      style:{background:'none',border:'none',color:'var(--text3)',fontSize:'.82rem',fontWeight:700,cursor:'pointer',marginBottom:4},
      onClick:()=>{ S._pinUser=null; S._pinVal=''; showUserList(); }
    },'← Back');

    body.appendChild(r('div',{style:{display:'flex',flexDirection:'column',gap:12,paddingTop:4,alignItems:'center'}},
      backBtn,av,dotsWrap,grid
    ));

    // Keyboard input for PIN pad
    if(window.__panelPinKey) window.removeEventListener('keydown', window.__panelPinKey);
    window.__panelPinKey = function(e){
      if(!document.getElementById('pin-dot-area') || !S._pinUser){
        window.removeEventListener('keydown', window.__panelPinKey);
        window.__panelPinKey = null;
        return;
      }
      if(/^[0-9]$/.test(e.key)){ e.preventDefault(); pressKey(Number(e.key)); }
      else if(e.key==='Backspace'){ e.preventDefault(); S._pinVal=S._pinVal.slice(0,-1); updateDots(); }
      else if(e.key==='Escape'){ e.preventDefault(); S._pinUser=null; S._pinVal=''; showUserList(); }
    };
    window.addEventListener('keydown', window.__panelPinKey);
  }

  // Build panel shell only if it doesn't exist yet
  const existing=document.getElementById('panel-shell');
  if(existing){
    // Panel already in DOM — just refresh the body content
    if(S._pinUser) showPinPad();
    else showUserList();
    return;
  }

  const wrap=r('div',{id:'panel-shell'},
    r('div',{class:'panel-bg',onClick:()=>{S.showPanel=false;S._pinUser=null;S._pinVal='';renderPanel();}}),
    r('div',{class:'panel'},
      r('div',{class:'panel-hdr'},
        r('div',{id:'panel-title',class:'panel-title'},"Who's here?"),
        r('button',{class:'modal-close',onClick:()=>{S.showPanel=false;S._pinUser=null;S._pinVal='';renderPanel();}},'✕')
      ),
      r('div',{id:'panel-body',style:{padding:'14px',flex:'1'}}),
      r('div',{style:{padding:'12px 14px',borderTop:'1.5px solid var(--border)',fontSize:'.72rem',color:'var(--text3)',fontWeight:700,textAlign:'center'}},'🔐 Parent profiles require PIN')
    )
  );
  mount('panel-mount', wrap);
  showUserList();
}

function selectUser(u){
  // Called directly for child users (no PIN needed)
  // For parent users after correct PIN, pressKey handles the flow directly
  S.currentUser=u;
  S.isAdmin=(u.role==='parent');
  S._pinUser=null; S._pinVal=''; S._pinShake=false;
  S.showPanel=false;
  mount('panel-mount', null);
  renderAll();
}

// PIN MODAL (in-app, for 🔐 button)
// ═══════════════════════════════════════════════════════════════
function openPinModal(){
  let pinVal='', pinShake=false;

  function updateDots(){
    const dots=document.querySelectorAll('#ipin-dots .pin-dot');
    dots.forEach((d,i)=>{
      d.className='pin-dot'+(i<pinVal.length?' on':'');
      if(pinShake){ d.style.borderColor='var(--red)'; }
      else { d.style.borderColor=''; }
    });
  }

  // Always coerce to string — sheet may return pin as a number
  const rawPin2 = (S.currentUser?.pin !== undefined && S.currentUser?.pin !== null && S.currentUser?.pin !== '') ? S.currentUser.pin : null;
  const correct = rawPin2 ? String(rawPin2).trim() : String(CONFIG.ADMIN_PIN).trim();

  const dots=r('div',{id:'ipin-dots',class:'pin-dots'},
    ...[0,1,2,3].map(()=>r('div',{class:'pin-dot'}))
  );

  // Keys built ONCE
  const keys=[1,2,3,4,5,6,7,8,9,'⌫',0,'✕'];
  const grid=r('div',{class:'pin-grid'},
    ...keys.map(k=>r('button',{class:'pin-key',onClick:()=>{
      if(k==='⌫'){ pinVal=pinVal.slice(0,-1); updateDots(); return; }
      if(k==='✕'){ mount('modal-mount',null); return; }
      if(pinVal.length>=4) return;
      pinVal+=String(k);
      updateDots();
      if(pinVal.length===4){
        if(pinVal===correct){ S.isAdmin=true; mount('modal-mount',null); renderAll(); showToast('👑 Parent mode on!'); }
        else { pinShake=true; updateDots(); setTimeout(()=>{ pinVal=''; pinShake=false; updateDots(); },500); }
      }
    }},String(k)))
  );

  const modal=r('div',{class:'modal-bg',onClick:e=>{if(e.target===e.currentTarget){mount('modal-mount',null);cleanup();}}},
    r('div',{class:'modal',style:{maxWidth:300,margin:'0 auto'}},
      r('div',{class:'modal-hdr'},
        r('div',{class:'modal-title'},'🔐 Parent Mode'),
        r('button',{class:'modal-close',onClick:()=>{mount('modal-mount',null);cleanup();}},'✕')
      ),
      r('div',{style:{display:'flex',flexDirection:'column',alignItems:'center',gap:16,paddingTop:8}},
        r('p',{style:{color:'var(--text3)',fontSize:'.85rem',fontWeight:700}},'Enter your 4-digit PIN'),
        dots, grid
      )
    )
  );
  mount('modal-mount', modal);

  // Keyboard input
  function cleanup(){ window.removeEventListener('keydown', onKey); }
  function onKey(e){
    if(!document.getElementById('ipin-dots')){ cleanup(); return; }
    if(/^[0-9]$/.test(e.key)){
      e.preventDefault();
      if(pinVal.length>=4) return;
      pinVal+=e.key; updateDots();
      if(pinVal.length===4){
        if(pinVal===correct){ cleanup(); S.isAdmin=true; mount('modal-mount',null); renderAll(); showToast('👑 Parent mode on!'); }
        else { pinShake=true; updateDots(); setTimeout(()=>{ pinVal=''; pinShake=false; updateDots(); },500); }
      }
    } else if(e.key==='Backspace'){ e.preventDefault(); pinVal=pinVal.slice(0,-1); updateDots(); }
    else if(e.key==='Escape'){ e.preventDefault(); cleanup(); mount('modal-mount',null); }
  }
  window.addEventListener('keydown', onKey);
}

// ── HOME ──

function timeToMins(t){if(!t)return 0;const[h,m]=t.split(':').map(Number);return h*60+m;}

// ── Recurrence expansion ──
const DAY_MAP = {Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6};
function expandRecurrence(rec, startDateStr, horizonDays){
  if(!rec||rec==='None') return [];
  const out=[];
  if(!startDateStr) startDateStr = todayStr();
  const start = new Date(startDateStr+'T12:00:00');
  const end = new Date(start); end.setDate(end.getDate()+horizonDays);
  const cur = new Date(start); cur.setDate(cur.getDate()+1);
  let customDays = null;
  if(rec.startsWith('Custom:')){
    customDays = rec.slice(7).split(',').map(d=>DAY_MAP[d]).filter(v=>v!==undefined);
  }
  while(cur<=end){
    let match=false;
    const dow=cur.getDay();
    if(rec==='Daily') match=true;
    else if(rec==='Weekdays') match = dow>=1&&dow<=5;
    else if(rec==='Weekly') match = dow===start.getDay();
    else if(rec==='Monthly') match = cur.getDate()===start.getDate();
    else if(customDays) match = customDays.includes(dow);
    if(match) out.push(localDateStr(cur));
    cur.setDate(cur.getDate()+1);
  }
  return out;
}
function recurrenceLabel(rec){
  if(!rec||rec==='None') return '';
  if(rec.startsWith('Custom:')) return 'Custom: '+rec.slice(7);
  return rec;
}

// ── Task sorting ──
const PRIORITY_RANK = {High:0, Medium:1, Low:2};
function taskSortKey(t){
  const d = normDate(t.due_date)||'9999-99-99';
  const tm = t.due_time||'24:00';
  const p = PRIORITY_RANK[t.priority]??1;
  return d+' '+tm+' '+p;
}
function sortTasks(arr){ return [...arr].sort((a,b)=>taskSortKey(a).localeCompare(taskSortKey(b))); }

// ── Pack overlapping time blocks into columns ──
function packIntoColumns(items){
  const sorted=[...items].sort((a,b)=>a.start-b.start||a.end-b.end);
  const cols=[];
  for(const it of sorted){
    let placed=false;
    for(let i=0;i<cols.length;i++){
      const last=cols[i][cols[i].length-1];
      if(last.end<=it.start){ cols[i].push(it); it.col=i; placed=true; break; }
    }
    if(!placed){ cols.push([it]); it.col=cols.length-1; }
  }
  const seen=new Set();
  for(const it of sorted){
    if(seen.has(it)) continue;
    const stack=[it]; const group=[];
    while(stack.length){
      const x=stack.pop(); if(seen.has(x)) continue;
      seen.add(x); group.push(x);
      for(const y of sorted){ if(seen.has(y)) continue; if(x.start<y.end&&y.start<x.end) stack.push(y); }
    }
    const maxCol=Math.max(...group.map(g=>g.col))+1;
    group.forEach(g=>{ g.cols=maxCol; });
  }
  return sorted;
}


// ── SKYLIGHT TIME-GRID CALENDAR ──────────────────────────────
function buildSkylightCalendar(opts){
  opts = opts || {};
  const filterUser  = opts.filterUser  !== undefined ? opts.filterUser  : S.calFilter;
  const showFilter  = opts.showFilter  !== undefined ? opts.showFilter  : true;
  const showAddBtn  = opts.showAddBtn  !== undefined ? opts.showAddBtn  : S.isAdmin;
  const onFilterChange = opts.onFilterChange || function(uid){ S.calFilter=uid; };

  const today  = new Date();
  const tdStr  = localDateStr(today);
  const sel    = S.calSelectedDate;
  const ws     = new Date(sel); ws.setDate(ws.getDate()-ws.getDay());
  const weekDays = Array.from({length:7},(_,i)=>{ const d=new Date(ws); d.setDate(d.getDate()+i); return d; });
  const START=5, END=22, HOURS=Array.from({length:END-START},(_,i)=>START+i);
  // Dynamic hour height: fit all 14 hours on screen without scrolling
  const OVERHEAD = 320; // topbar + bottomnav + nav + chips + headers + padding
  const availH = (window.innerHeight || 700) - OVERHEAD;
  const HH = Math.max(26, Math.min(52, Math.floor(availH / HOURS.length)));
  const TOTAL = (END-START)*60;
  const nowMins = today.getHours()*60+today.getMinutes();
  const nowTop  = ((nowMins-START*60)/TOTAL)*HOURS.length*HH;
  const showNow = today.getHours()>=START && today.getHours()<END;
  const cols = weekDays.length;

  // Filter tasks/events by selected user
  function filteredTasks(ds){
    return S.tasks.filter(t => normDate(t.due_date)===ds && (filterUser==='all' || t.assigned_to===filterUser));
  }
  function filteredEvents(ds){
    return S.events.filter(e => normDate(e.start_date)===ds && (filterUser==='all' || !e.assigned_to || e.assigned_to==='' || e.assigned_to===filterUser));
  }

  // ── Member filter chips ──
  function buildFilterChips(containerId){
    const chips = r('div',{id:containerId, class:'sky-member-chips',style:{padding:'6px 0 4px'}},
      r('button',{
        class:'sky-chip'+(filterUser==='all'?' active':''),
        style:filterUser==='all'?{background:'var(--accbg)',borderColor:'var(--accent)',color:'var(--accent)'}:{},
        onClick:()=>{ onFilterChange('all'); }
      },'👨‍👩‍👧‍👦 Everyone'),
      ...S.users.map(u=>{
        const p=getUserPastel(u.user_id);
        const isOn=filterUser===u.user_id;
        return r('button',{
          class:'sky-chip'+(isOn?' active':''),
          style:isOn?{background:p.bg,borderColor:p.border,color:p.text}:{},
          onClick:()=>{ onFilterChange(u.user_id); }
        }, avatarEl(u,28), u.name);
      })
    );
    return chips;
  }

  // ── Nav bar ──
  const nav = r('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'10px 12px 6px',flexWrap:'wrap',gap:6}},
    r('div',{style:{display:'flex',gap:5,alignItems:'center'}},
      r('button',{style:{background:'none',border:'1.5px solid var(--border)',borderRadius:8,padding:'5px 11px',cursor:'pointer',fontSize:'.78rem',fontWeight:700,color:'var(--text2)'},
        onClick:()=>{ const d=new Date(ws);d.setDate(d.getDate()-7);S.calSelectedDate=d; opts.onNavigate&&opts.onNavigate(); }},'< Prev'),
      r('button',{style:{background:'var(--accbg)',border:'1.5px solid var(--accent)',borderRadius:8,padding:'5px 11px',cursor:'pointer',fontSize:'.78rem',fontWeight:700,color:'var(--accent)'},
        onClick:()=>{ S.calSelectedDate=new Date(); opts.onNavigate&&opts.onNavigate(); }},'Today'),
      r('button',{style:{background:'none',border:'1.5px solid var(--border)',borderRadius:8,padding:'5px 11px',cursor:'pointer',fontSize:'.78rem',fontWeight:700,color:'var(--text2)'},
        onClick:()=>{ const d=new Date(ws);d.setDate(d.getDate()+7);S.calSelectedDate=d; opts.onNavigate&&opts.onNavigate(); }},'Next >')
    ),
    r('div',{style:{textAlign:'center',flex:'1',minWidth:120}},
      r('div',{style:{fontFamily:"'Plus Jakarta Sans',sans-serif",fontSize:'.95rem',fontWeight:800,color:'var(--text)'}},
        weekDays[3].toLocaleDateString([],{month:'long',year:'numeric'})
      ),
      r('div',{style:{fontSize:'.7rem',color:'var(--text3)',fontWeight:600}},
        weekDays[0].toLocaleDateString([],{month:'short',day:'numeric'})+' – '+weekDays[6].toLocaleDateString([],{month:'short',day:'numeric'})
      )
    ),
    showAddBtn ? r('button',{class:'btn btn-primary',style:{padding:'5px 12px',fontSize:'.75rem'},
      onClick:()=>openEventModal(tdStr)},'+ Event') : null
  );

  // ── Day headers ──
  const dayHdr = r('div',{class:'sky-week-header',style:{gridTemplateColumns:'44px repeat('+cols+',1fr)'}},
    r('div',{style:{width:44,borderRight:'1px solid var(--border)'}}),
    ...weekDays.map((d,di)=>{
      const ds=localDateStr(d);
      const isT=ds===tdStr;
      const showMonth=d.getDate()===1||di===0;
      return r('div',{class:'sky-day-hdr'},
        r('div',{class:'sky-day-name'},d.toLocaleDateString([],{weekday:'short'})),
        r('div',{style:{display:'flex',alignItems:'center',justifyContent:'center',gap:3}},
          r('div',{class:'sky-day-num'+(isT?' today':''),onClick:()=>{S.calSelectedDate=d;opts.onNavigate&&opts.onNavigate();}},d.getDate()),
          showMonth?r('div',{style:{fontSize:'.6rem',fontWeight:700,color:isT?'var(--accent)':'var(--text3)',letterSpacing:'.02em',marginTop:1}},d.toLocaleDateString([],{month:'short'})):null
        )
      );
    })
  );

  // ── All-day row (events + tasks without time) ──
  const allDayEvts  = weekDays.map(d=>filteredEvents(localDateStr(d)).filter(e=>!e.start_time));
  const allDayTasks = weekDays.map(d=>filteredTasks(localDateStr(d)).filter(t=>!t.due_time||t.due_time===''));
  const hasAllDay   = allDayEvts.some(a=>a.length>0)||allDayTasks.some(a=>a.length>0);
  const allDayRow   = hasAllDay ? r('div',{class:'sky-allday-row',style:{gridTemplateColumns:'44px repeat('+cols+',1fr)'}},
    r('div',{style:{width:44,borderRight:'1px solid var(--border)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'.58rem',color:'var(--text3)',padding:2,flexDirection:'column',gap:1}},r('span',{},'all'),r('span',{},'day')),
    ...weekDays.map((_,di)=>r('div',{class:'sky-allday-cell'},
      ...allDayEvts[di].map(ev=>{
        const u=ev.assigned_to?getUser(ev.assigned_to):null;
        const p=u?getUserPastel(u.user_id):{bg:'var(--bg2)',border:'var(--border)',text:'var(--text2)'};
        return r('div',{class:'sky-allday-ev',style:{background:p.bg,color:p.text,borderLeft:'3px solid '+p.border}},
          ev.title+(u?' · '+u.name:'')
        );
      }),
      ...allDayTasks[di].map(t=>{
        const u=getUser(t.assigned_to);
        const p=u?getUserPastel(u.user_id):{bg:'var(--bg2)',border:'var(--border)',text:'var(--text2)'};
        const done=t.status==='completed';
        return r('div',{class:'sky-allday-ev',
          style:{background:done?'var(--greenbg)':p.bg,color:done?'var(--green)':p.text,
            borderLeft:'3px solid '+(done?'var(--green)':p.border),
            textDecoration:done?'line-through':'none',cursor:'pointer'},
          onClick:async()=>{
            if(!S.isAdmin&&!S.currentUser){S.showPanel=true;renderPanel();return;}
            if(!done){try{await API.completeTask(t.task_id);launchConfetti();showToast('Done!');const data=await API.readAll();if(data){S.tasks=data.tasks||[];S.rewards=data.rewards||[];}renderContent();}catch(e){showToast(e.message,false);}}
          }
        },catIcon(t.category)+' '+t.title+(u?' · '+u.name:''));
      })
    ))
  ):null;

  // ── Time column ──
  const timeCol = r('div',{class:'sky-time-col'},
    ...HOURS.map(h=>r('div',{class:'sky-time-label',style:{height:HH+'px'}},h<12?h+' AM':h===12?'12 PM':(h-12)+' PM'))
  );

  // ── Day columns ──
  const dayCols = r('div',{class:'sky-day-cols',style:{gridTemplateColumns:'repeat('+cols+',1fr)'}},
    ...weekDays.map((d,di)=>{
      const ds=localDateStr(d);
      const isT=ds===tdStr;
      const evts  = filteredEvents(ds).filter(e=>e.start_time);
      const tasks = filteredTasks(ds).filter(t=>t.due_time);

      const hourRows = HOURS.map(h=>r('div',{class:'sky-hour-row',
        style:{height:HH+'px',background:isT&&h===today.getHours()?'rgba(224,90,58,0.025)':''}}));

      // Build unified items + pack overlapping ones into columns
      const items = [];
      evts.forEach(ev=>{
        const sm=timeToMins(ev.start_time);
        const em=ev.end_time?timeToMins(ev.end_time):sm+60;
        const htPx=Math.max(24,(em-sm)/60*HH-2);
        items.push({kind:'event', data:ev, start:sm, end:sm+Math.max(em-sm, Math.ceil((htPx+2)/HH*60)), htPx});
      });
      tasks.forEach(t=>{
        const sm=timeToMins(t.due_time);
        const htPx=Math.max(24, Math.round(HH*0.9));
        items.push({kind:'task', data:t, start:sm, end:sm+Math.ceil((htPx+2)/HH*60), htPx});
      });
      packIntoColumns(items);

      const evtBlocks=[]; const taskBlocks=[];
      items.forEach(it=>{
        const widthPct = 100/it.cols;
        const leftPct = widthPct*it.col;
        const colStyle = {
          left:'calc('+leftPct+'% + 4px)',
          width:'calc('+widthPct+'% - 6px)',
        };
        if(it.kind==='event'){
          const ev=it.data;
          const u=ev.assigned_to?getUser(ev.assigned_to):null;
          const p=u?getUserPastel(u.user_id):{bg:'var(--bg2)',border:'var(--border)',text:'var(--text2)'};
          const top=Math.max(0,(it.start-START*60)/60*HH);
          const ht=it.htPx;
          evtBlocks.push(r('div',{class:'sky-event',
            style:{top:top+'px',height:ht+'px',background:p.bg,borderLeft:'3px solid '+p.border,color:p.text,...colStyle}},
            r('div',{class:'sky-event-title'},ev.title),
            ht>28?r('div',{class:'sky-event-time'},
              (u?u.name:'')+(ev.start_time?' · '+fmt12(ev.start_time)+(ev.end_time?' – '+fmt12(ev.end_time):''):'')
            ):null,
            u&&it.cols<3?r('div',{class:'sky-event-av',style:{background:p.bg}},initials(u)):null
          ));
        } else {
          const t=it.data;
          const u=getUser(t.assigned_to);
          const p=u?getUserPastel(u.user_id):{bg:'var(--bg2)',border:'var(--border)',text:'var(--text2)'};
          const top=Math.max(0,(it.start-START*60)/60*HH);
          const ht=it.htPx;
          const done=t.status==='completed';
          taskBlocks.push(r('div',{class:'sky-event',
            style:{top:top+'px',height:ht+'px',
              background:done?'var(--greenbg)':p.bg,
              borderLeft:'3px solid '+(done?'var(--green)':p.border),
              color:done?'var(--green)':p.text,
              opacity:done?.7:1, ...colStyle},
            onClick:async()=>{
              if(!S.isAdmin&&!S.currentUser){S.showPanel=true;renderPanel();return;}
              try{
                if(done){ await API.reopenTask(t.task_id); showToast('Marked open'); }
                else { await API.completeTask(t.task_id); launchConfetti(); showToast('Done!'); }
                const data=await API.readAll();
                if(data){S.tasks=data.tasks||[];S.rewards=data.rewards||[];}
                renderContent();
              }catch(e){showToast(e.message,false);}
            }},
            r('div',{class:'sky-event-title',style:{textDecoration:done?'line-through':'none'}},
              catIcon(t.category)+' '+t.title
            ),
            ht>34?r('div',{class:'sky-event-time'},
              (u?u.name:'')+(t.due_time?' · '+fmt12(t.due_time):'')
            ):null,
            u&&it.cols<3?r('div',{class:'sky-event-av',style:{background:done?'var(--greenbg)':p.bg}},initials(u)):null
          ));
        }
      });

      const nowLine=(isT&&showNow)?r('div',{class:'sky-now-line',style:{top:nowTop+'px'}}):null;
      return r('div',{class:'sky-day-col',style:{minHeight:HOURS.length*HH+'px'}},
        ...hourRows,...evtBlocks,...taskBlocks,nowLine);
    })
  );

  const gridBody = r('div',{class:'sky-grid-wrap'},
    timeCol,
    r('div',{style:{flex:1,position:'relative'}},dayCols)
  );

  const container = r('div',{style:{background:'var(--surface)',borderRadius:'var(--r)',border:'1px solid var(--border)',overflow:'hidden',boxShadow:'var(--sh-1)',marginTop:10}},
    r('div',{style:{padding:'0 12px'}},nav),
    showFilter ? r('div',{style:{padding:'0 12px',borderBottom:'1px solid var(--border)'}},buildFilterChips('cal-filter-'+Math.random().toString(36).slice(2))) : null,
    dayHdr,
    allDayRow,
    gridBody
  );
  return container;
}

function buildCalendarFull(){
  const today=new Date();
  let viewDate=new Date(S.calSelectedDate);
  let mode=S.calViewMode;

  function draw(){
    const wrap=document.getElementById('cal-inner');
    if(!wrap)return;
    wrap.innerHTML='';
    S.calViewMode=mode;

    // ── Header with mode toggle + add event ──
    const hdr=r('div',{class:'sh',style:{marginTop:4,marginBottom:8}},
      r('div',{class:'sh-title'},'Family calendar'),
      r('div',{style:{display:'flex',gap:6,alignItems:'center'}},
        r('button',{class:'ps-pill'+(mode==='week'?' on':''),onClick:()=>{mode='week';S.calSelectedDate=viewDate;draw()}},'Week'),
        r('button',{class:'ps-pill'+(mode==='month'?' on':''),onClick:()=>{mode='month';draw()}},'Month'),
        S.isAdmin?r('button',{class:'btn btn-primary',style:{padding:'5px 11px',fontSize:'.75rem'},
          onClick:()=>openEventModal(localDateStr(viewDate))},'+ Event'):null
      )
    );
    wrap.appendChild(hdr);

    if(mode==='week'){
      // Use the shared Skylight time-grid
      S.calSelectedDate=viewDate;
      const grid=buildSkylightCalendar({
        showAddBtn: false, // already in header above
        onNavigate:()=>{
          viewDate=new Date(S.calSelectedDate);
          draw();
        },
        onFilterChange:(uid)=>{
          S.calFilter=uid;
          draw();
        },
      });
      wrap.appendChild(grid);

    } else {
      // Month grid view
      const y=viewDate.getFullYear(), m=viewDate.getMonth();
      const firstDay=new Date(y,m,1).getDay();
      const daysInMonth=new Date(y,m+1,0).getDate();
      const tdStr=localDateStr(today);

      const nav=r('div',{class:'cal-nav',style:{marginBottom:10}},
        r('button',{class:'cal-nav-btn',onClick:()=>{viewDate=new Date(y,m-1,1);draw()}},'‹'),
        r('div',{class:'cal-nav-title'},new Date(y,m).toLocaleDateString([],{month:'long',year:'numeric'})),
        r('button',{class:'cal-nav-btn',onClick:()=>{viewDate=new Date(y,m+1,1);draw()}},'›')
      );
      wrap.appendChild(nav);

      // Month filter chips
      const filterChips=r('div',{class:'sky-member-chips',style:{marginBottom:10}},
        r('button',{
          class:'sky-chip'+(S.calFilter==='all'?' active':''),
          style:S.calFilter==='all'?{background:'var(--accbg)',borderColor:'var(--accent)',color:'var(--accent)'}:{},
          onClick:()=>{S.calFilter='all';draw();}
        },'👨‍👩‍👧‍👦 Everyone'),
        ...S.users.map(u=>{
          const p=getUserPastel(u.user_id);
          const isOn=S.calFilter===u.user_id;
          return r('button',{
            class:'sky-chip'+(isOn?' active':''),
            style:isOn?{background:p.bg,borderColor:p.border,color:p.text}:{},
            onClick:()=>{S.calFilter=u.user_id;draw();}
          },avatarEl(u,28),u.name);
        })
      );
      wrap.appendChild(filterChips);

      const grid=r('div',{class:'month-grid'},
        ...['Su','Mo','Tu','We','Th','Fr','Sa'].map(d=>r('div',{class:'month-hdr'},d)),
        ...Array.from({length:firstDay},()=>r('div',{class:'month-day other-month'})),
        ...Array.from({length:daysInMonth},(_,i)=>{
          const day=i+1;
          const ds=y+'-'+String(m+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');
          const tasks=S.tasks.filter(t=>normDate(t.due_date)===ds&&(S.calFilter==='all'||t.assigned_to===S.calFilter));
          const evts=S.events.filter(e=>normDate(e.start_date)===ds&&(S.calFilter==='all'||!e.assigned_to||e.assigned_to===''||e.assigned_to===S.calFilter));
          const cls='month-day'+(ds===tdStr?' today':'');
          return r('div',{class:cls,
            onClick:()=>{viewDate=new Date(y,m,day);S.calSelectedDate=new Date(y,m,day);mode='week';draw();}},
            r('div',{class:'mday-num'},day),
            ...evts.slice(0,2).map(ev=>{
              const u=ev.assigned_to?getUser(ev.assigned_to):null;
              const p=u?getUserPastel(u.user_id):{bg:'var(--accent)',border:'var(--accent)',text:'#fff'};
              return r('div',{style:{fontSize:'.6rem',fontWeight:700,background:p.bg,color:p.text,borderRadius:3,padding:'1px 4px',marginBottom:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},ev.title);
            }),
            ...tasks.slice(0,evts.length>=2?0:2-evts.length).map(t=>{
              const u=getUser(t.assigned_to);
              const p=u?getUserPastel(u.user_id):{bg:'var(--bg2)',border:'var(--border)',text:'var(--text2)'};
              return r('div',{style:{fontSize:'.6rem',fontWeight:700,background:p.bg,color:p.text,borderRadius:3,padding:'1px 4px',marginBottom:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},catIcon(t.category)+' '+t.title);
            }),
            (evts.length+tasks.length)>2?r('div',{style:{fontSize:'.6rem',color:'var(--text3)',fontWeight:700}},
              '+'+(evts.length+tasks.length-2)+' more'
            ):null
          );
        })
      );
      wrap.appendChild(grid);
    }
  }

  const outer=r('div',{class:'anim-in'},r('div',{id:'cal-inner'}));
  setTimeout(draw,0);
  return outer;
}

// ── Automated self-tests ──
async function runSelfTests(){
  const out = document.getElementById('selftest-out');
  if(!out) return;
  out.style.display='block'; out.textContent='Running…\n';
  const log=(s,ok)=>{ out.textContent += (ok==null?'· ':(ok?'✅ ':'❌ '))+s+'\n'; out.scrollTop=out.scrollHeight; };
  let pass=0, fail=0;
  const T = async (name, fn)=>{
    try{ const v=await fn(); if(v===false){ fail++; log(name,false); } else { pass++; log(name,true); } }
    catch(e){ fail++; log(name+' — '+(e.message||e),false); }
  };
  // Sandbox: run against an in-memory copy so the Google Sheet is never touched
  const snap = JSON.parse(JSON.stringify({tasks:S.tasks, rewards:S.rewards, events:S.events}));
  const demoSnap = {tasks:DEMO.tasks, rewards:DEMO.rewards, events:DEMO.events};
  const wasDemo = CONFIG.DEMO_MODE;
  CONFIG.DEMO_MODE = true;
  DEMO.tasks = JSON.parse(JSON.stringify(snap.tasks)); DEMO.rewards = JSON.parse(JSON.stringify(snap.rewards)); DEMO.events = JSON.parse(JSON.stringify(snap.events));
  const TT = ()=>DEMO.tasks;
  try{
    log('— Helpers');
    await T('timeToMins("09:30")===570', ()=>timeToMins('09:30')===570);
    await T('sortTasks puts earlier first', ()=>{
      const a=[{due_date:'2026-01-02',due_time:'10:00',priority:'Low'},{due_date:'2026-01-01',due_time:'09:00',priority:'High'}];
      return sortTasks(a)[0].due_date==='2026-01-01';
    });
    await T('expandRecurrence Daily 5d → 5 dates', ()=>expandRecurrence('Daily','2026-05-10',5).length===5);
    await T('expandRecurrence Weekdays skips weekend', ()=>{
      const ds=expandRecurrence('Weekdays','2026-05-10',7);
      return ds.every(d=>{ const dow=new Date(d+'T12:00:00').getDay(); return dow>=1&&dow<=5; });
    });
    await T('expandRecurrence Custom:Mon,Wed only', ()=>{
      const ds=expandRecurrence('Custom:Mon,Wed','2026-05-10',14);
      return ds.every(d=>{ const dow=new Date(d+'T12:00:00').getDay(); return dow===1||dow===3; });
    });
    await T('packIntoColumns separates overlap', ()=>{
      const its=[{start:0,end:60},{start:30,end:90}];
      packIntoColumns(its);
      return its[0].cols===2 && its[1].cols===2 && its[0].col!==its[1].col;
    });
    await T('packIntoColumns merges non-overlap', ()=>{
      const its=[{start:0,end:60},{start:60,end:120}];
      packIntoColumns(its);
      return its[0].cols===1 && its[1].cols===1;
    });

    log('— CRUD');
    const testTitle='__test_'+Date.now();
    const before=TT().length;
    await API.addTask({title:testTitle,assigned_to:S.users[0]?.user_id||'',due_date:todayStr(),status:'pending',reward_points:0,category:'Chore',priority:'Low',recurrence:'None'});
    let added=TT().find(t=>t.title===testTitle);
    await T('Add task', ()=>!!added && TT().length===before+1);

    await API.completeTask(added.task_id);
    added=TT().find(t=>t.task_id===added.task_id);
    await T('Complete sets status', ()=>added.status==='completed');
    await T('Complete stamps user name', ()=>!!added.completed_by_name || !S.currentUser);

    await API.reopenTask(added.task_id);
    added=TT().find(t=>t.task_id===added.task_id);
    await T('Reopen flips back to pending', ()=>added.status==='pending'&&!added.completed_at);

    await API.updateTask({...added, title:testTitle+'_upd'});
    added=TT().find(t=>t.task_id===added.task_id);
    await T('Update task title', ()=>added.title===testTitle+'_upd');

    await API.deleteTask(added.task_id);
    await T('Delete task', ()=>!TT().find(t=>t.task_id===added.task_id));

    log('— Bulk + recurrence');
    const bulkTitle='__bulk_'+Date.now();
    const dates=['2026-06-01','2026-06-02','2026-06-03'];
    await API.addTasksBulk(dates.map(d=>({title:bulkTitle,due_date:d,status:'pending',assigned_to:S.users[0]?.user_id||'',reward_points:0,category:'Chore',priority:'Low',recurrence:'None'})));
    await T('Bulk add creates N tasks', ()=>TT().filter(t=>t.title===bulkTitle).length===3);
    await T('Bulk tasks keep their dates', ()=>dates.every(d=>TT().some(t=>t.title===bulkTitle&&t.due_date===d)));

    log('— UI');
    await T('Render: home builds', ()=>!!buildHome());
    await T('Render: tasks builds', ()=>!!buildTasks());
    await T('Render: calendar builds', ()=>!!buildCalendarFull());
    await T('Render: routines builds', ()=>!!buildRoutines());
    await T('Render: rewards builds', ()=>!!buildRewards());
    await T('Render: settings builds', ()=>!!buildSettings());

    log('— Mobile');
    await T('Content has bottom padding', ()=>{
      const c=document.getElementById('content');
      return c && (window.innerWidth>=1024 || parseInt(getComputedStyle(c).paddingBottom)>=80);
    });
  } finally {
    // Restore real state
    CONFIG.DEMO_MODE = wasDemo;
    DEMO.tasks=demoSnap.tasks; DEMO.rewards=demoSnap.rewards; DEMO.events=demoSnap.events;
    S.tasks=snap.tasks; S.rewards=snap.rewards; S.events=snap.events;
  }
  out.textContent += '\n'+(fail===0?'🟢 ':'🔴 ')+pass+' passed · '+fail+' failed';
  showToast(fail===0?('All '+pass+' tests passed'):(fail+' tests failed'), fail===0);
}

function routineAppliesToday(ri){
  const d=new Date().getDay(), v=String(ri.day_of_week||'Daily').trim();
  if(!v||v==='Daily'||v==='Weekly') return true;
  if(v==='Weekdays') return d>=1&&d<=5;
  if(v==='Weekends') return d===0||d===6;
  return v.split(/[,\s]+/).some(x=>DAY_MAP[x.slice(0,3)]===d);
}
function routineActive(ri){ return !(ri.active===false||String(ri.active).toUpperCase()==='FALSE'); }
function routineStepTask(ri){

  const c=S.tasks.filter(t=>normDate(t.due_date)===td&&t.assigned_to===ri.assigned_to&&String(t.title||'').trim().toLowerCase()===title);
  if(!c.length) return null; if(!rt) return c[0];
  const sc=c.map(t=>({t,d:t.due_time?Math.abs(timeToMins(normTime(t.due_time))-timeToMins(rt)):0})).filter(x=>x.d<=120).sort((a,b)=>a.d-b.d);

function buildRoutines(){
  const kid=isKidMode(), F=S.routineFilter||'all';

    ...whoIds.map(getUser).map(u=>r('button',{class:'hh-fchip'+(F===u.user_id?' on':''),style:cv(memberColor(u.user_id)),onClick:()=>{S.routineFilter=u.user_id;renderContent();}},avatarEl(u,34),u.name))));
  let count=0;
  const groups=ROUTINE_GROUPS.slice();
  today.forEach(ri=>{ if(!groups.find(g=>g.name===ri.routine_name)) groups.push({name:ri.routine_name,icon:'🔁',label:ri.routine_name}); });
  groups.forEach(g=>{
    const by={}; today.filter(ri=>ri.routine_name===g.name&&(filterUid==='all'||ri.assigned_to===filterUid)).forEach(ri=>{ (by[ri.assigned_to]=by[ri.assigned_to]||[]).push(ri); });
    Object.keys(by).forEach(uid=>{ wrap.appendChild(buildRoutineCard(g,uid,by[uid])); count++; });
  });
  if(!count) wrap.appendChild(emptyState('🌤','No routines today',S.isAdmin?'Add steps like “Brush teeth” or “Pack bag” to build one.':'Nothing to do here today.'));
  const other=active.length-today.length;

  return wrap;
}

// ── REWARDS ──
function userStreak(uid){
  const days=new Set();
  S.rewards.filter(x=>x.user_id===uid).forEach(x=>{ const d=normDate(x.date); if(d) days.add(d); });
  S.tasks.filter(t=>t.assigned_to===uid&&t.status==='completed'&&t.completed_at).forEach(t=>{ const d=new Date(t.completed_at); if(!isNaN(d)) days.add(localDateStr(d)); });
  let n=0; const cur=new Date(); if(!days.has(localDateStr(cur))) cur.setDate(cur.getDate()-1);
  while(days.has(localDateStr(cur))){ n++; cur.setDate(cur.getDate()-1); }
  return n;
}
function achievementsFor(uid){
  const doneT=S.tasks.filter(t=>t.assigned_to===uid&&t.status==='completed');
  const cat=c=>doneT.filter(t=>t.category===c).length;
  const total=Math.max(doneT.length,S.rewards.filter(x=>x.user_id===uid).length), streak=userStreak(uid);
  return [
    {e:'🔥',t:streak>=2?streak+'-day streak':'Streak starter',got:streak>=2,p:streak>=2?'':streak+'/2 days'},
    {e:'📚',t:'Homework hero',got:cat('School')>=3,p:Math.min(cat('School'),3)+'/3'},
    {e:'🧹',t:'Tidy-up champion',got:cat('Chore')>=3,p:Math.min(cat('Chore'),3)+'/3'},
    {e:'🐾',t:'Pet pal',got:cat('Pet')>=3,p:Math.min(cat('Pet'),3)+'/3'},
    {e:'⭐',t:'50 to-dos done',got:total>=50,p:Math.min(total,50)+'/50'},
  ];
}
function buildStarCard(u){
  const c=memberColor(u.user_id), pts=userPoints(u.user_id), goals=rewardGoals(), ng=nextGoal(pts), reached=goals.filter(g=>pts>=g.cost);
  const pct=ng?Math.round(pts/ng.cost*100):100;
  return r('div',{class:'hh-starcard',style:cv(c)},
    r('div',{class:'hh-star-head'},avatarEl(u,56),r('div',{style:{flex:'1',minWidth:0}},r('div',{class:'hh-star-name'},u.name),r('div',{class:'hh-star-sub'},'My stars')),r('div',{class:'hh-star-num'},'⭐ '+pts,r('small',{},' stars'))),
    ng?r('div',{class:'hh-goal'},r('span',{class:'hh-goal-e','aria-hidden':'true'},ng.emoji),r('div',{style:{flex:'1',minWidth:0}},
        r('div',{class:'hh-goal-l'},'Next reward'),r('div',{class:'hh-goal-t'},ng.title),
        r('div',{class:'hh-prog lg'},r('i',{style:{width:pct+'%'}})),r('div',{class:'hh-goal-n'},pts+' / '+ng.cost+' stars'),r('div',{class:'hh-goal-togo'},(ng.cost-pts)+' stars to go!')))
      :r('div',{class:'hh-goal'},r('span',{class:'hh-goal-e','aria-hidden':'true'},'🏆'),r('div',{},r('div',{class:'hh-goal-t'},goals.length?'Every reward unlocked!':'No rewards set yet'),r('div',{class:'hh-goal-n'},goals.length?'Ask a parent to redeem one.':'A parent can add rewards to work toward.'))),
    reached.length?r('div',{class:'hh-ready'},r('strong',{},'Ready to redeem'),...reached.map(g=>r('span',{class:'hh-ready-i'},g.emoji+' '+g.title))):null,
    r('div',{class:'hh-badges'},...achievementsFor(u.user_id).map(a=>r('span',{class:'hh-badge-a'+(a.got?'':' locked'),title:a.got?'Earned':'In progress'},r('span',{class:'e','aria-hidden':'true'},a.e),a.t,!a.got&&a.p?r('span',{class:'p'},a.p):null))));
}
function buildRewards(){
  const kid=isKidMode(), kids=kid?[S.currentUser]:S.users.filter(u=>u.role==='child'), goals=rewardGoals();
  const wrap=r('div',{class:'anim-in'},pageHead(kid?'My stars':'Rewards',kid?'Every to-do you finish earns stars':'Stars earned for to-dos and routines',S.isAdmin?r('button',{class:'btn btn-primary',onClick:()=>openRewardModal()},icon('plus',18),'Add reward'):null));
  wrap.appendChild(kids.length?r('div',{class:'hh-stars-grid'},...kids.map(buildStarCard)):emptyState('⭐','No kids yet','Add children in the Users tab of your sheet.'));
  wrap.appendChild(r('div',{class:'hh-sec-head',style:{marginTop:'28px'}},r('div',{class:'hh-sec-title'},icon('gift',20),'Rewards to earn')));
  wrap.appendChild(goals.length?r('div',{class:'hh-goals'},...goals.slice().sort((a,b)=>a.cost-b.cost).map(g=>r('div',{class:'hh-goal-row'},
      r('span',{class:'hh-goal-e','aria-hidden':'true'},g.emoji),r('div',{style:{flex:'1',minWidth:0}},r('div',{class:'hh-goal-t'},g.title),r('div',{class:'hh-goal-n'},'⭐ '+g.cost+' stars')),
      S.isAdmin?r('button',{class:'hh-mini danger',title:'Remove','aria-label':'Remove reward',onClick:()=>{ if(!confirm('Remove "'+g.title+'"?')) return; lsSet('hh_reward_goals',rewardGoals().filter(x=>x.id!==g.id)); renderContent(); }},icon('trash',18)):null)))
    :emptyState('🎁','No rewards yet','Parents can add something fun to work toward.'));
  const recent=S.rewards.filter(x=>!kid||x.user_id===S.currentUser.user_id).slice().sort((a,b)=>String(normDate(b.date)).localeCompare(String(normDate(a.date)))||String(b.reward_id).localeCompare(String(a.reward_id))).slice(0,8);
  if(recent.length){
    wrap.appendChild(r('div',{class:'hh-sec-head',style:{marginTop:'28px'}},r('div',{class:'hh-sec-title'},'Recent stars')));
    wrap.appendChild(r('div',{class:'hh-recent'},...recent.map(x=>{ const u=getUser(x.user_id);
      return r('div',{class:'hh-recent-row'},u?avatarEl(u,34):null,r('div',{style:{flex:'1',minWidth:0}},r('div',{class:'hh-recent-t'},x.reason||'Stars'),r('div',{class:'hh-recent-s'},(u?u.name+' · ':'')+fmtDate(x.date))),r('span',{class:'hh-stars'},'⭐ +'+x.points)); })));
  }
  return wrap;
}

// ── KID MODE ──
function buildKidMode(){
  const u=S.currentUser, c=memberColor(u.user_id), td=todayStr();
  const mine=sortTasks(S.tasks.filter(t=>t.assigned_to===u.user_id&&normDate(t.due_date)===td));
  const open=mine.filter(t=>t.status!=='completed'), done=mine.filter(t=>t.status==='completed');
  const pct=mine.length?Math.round(done.length/mine.length*100):0, pts=userPoints(u.user_id), ng=nextGoal(pts);
  const head=r('section',{class:'hh-kid-head',style:cv(c)},
    avatarEl(u,84),
    r('div',{style:{flex:'1',minWidth:'220px'}},
      r('div',{class:'hh-kid-hi'},greetFor(dayPart())+', '+u.name+'! '+greetEmoji(dayPart())),
      r('div',{class:'hh-kid-day'},'Your day'),
      r('div',{class:'hh-kid-count'},mine.length?done.length+' of '+mine.length+' things finished':'Nothing on your list today'),
      mine.length?r('div',{class:'hh-kid-prog',role:'progressbar','aria-valuenow':pct,'aria-valuemin':0,'aria-valuemax':100},r('i',{style:{width:pct+'%'}})):null),
    r('button',{class:'hh-kid-stars',onClick:()=>{S.activeTab='rewards';renderContent();}},r('div',{class:'n'},'⭐ '+pts),r('div',{class:'s'},ng?(ng.cost-pts)+' more to '+ng.emoji+' '+ng.title:'Stars earned')));
  const card=t=>{ const d=t.status==='completed';
    return r('div',{class:'hh-kid-card'+(d?' done':''),style:cv(c)},
      r('div',{class:'hh-kid-emoji','aria-hidden':'true'},smartIcon(t.title,catIcon(t.category))),
      r('div',{class:'hh-kid-title'},t.title),
      t.due_time?r('div',{class:'hh-kid-time'},fmt12(normTime(t.due_time))):null,
      t.reward_points>0?r('div',{class:'hh-stars'},'⭐ +'+t.reward_points):null,
      d?r('div',{class:'hh-kid-donewrap'},r('div',{class:'hh-kid-done'},icon('check',22),'DONE!'),r('div',{class:'hh-kid-awesome'},'Awesome job! ⭐')):r('button',{class:'hh-kid-btn',onClick:e=>toggleTask(t,e.currentTarget)},'I DID IT!'),
      d?r('button',{class:'hh-undo',onClick:e=>toggleTask(t,e.currentTarget)},'Oops, not yet'):null); };
  const out=r('div',{class:'anim-in hh-kid'},head);
  if(!mine.length||!open.length) out.appendChild(emptyState('🎉','You’re all caught up!',mine.length?'Everything on your list is finished.':'Nothing else on your list today.'));
  if(open.length){ out.appendChild(r('div',{class:'hh-group-label'},'To do · '+open.length)); out.appendChild(r('div',{class:'hh-kid-grid'},...open.map(card))); }
  if(done.length){ out.appendChild(r('div',{class:'hh-group-label'},'Finished · '+done.length)); out.appendChild(r('div',{class:'hh-kid-grid'},...done.map(card))); }
  const rts=S.routines.filter(ri=>ri.assigned_to===u.user_id&&routineActive(ri)&&routineAppliesToday(ri));
  if(rts.length){ out.appendChild(r('div',{class:'hh-group-label'},'My routines')); ROUTINE_GROUPS.forEach(g=>{ const it=rts.filter(ri=>ri.routine_name===g.name); if(it.length) out.appendChild(buildRoutineCard(g,u.user_id,it)); }); }
  return out;
}

// ── RENDER CONTENT ──
function renderContent(){
  applyMemberColors();
  const kid=isKidMode();
  if(kid&&!['home','routines','rewards','settings'].includes(S.activeTab)) S.activeTab='home';
  let view;
  if(kid&&S.activeTab==='home') view=buildKidMode();
  else switch(S.activeTab){
    case 'tasks':    view=buildTasks(); break;
    case 'calendar': view=buildCalendarFull(); break;
    case 'routines': view=buildRoutines(); break;
    case 'rewards':  view=buildRewards(); break;
    case 'settings': view=r('div',{class:'anim-in'},pageHead('Settings','Appearance, family members and parent controls'),buildSettings()); break;
    default:         view=buildHome();
  }
  mount('content',view);
  renderBottomNav();
  renderTopBar();
  const fab=document.querySelector('.fab'); if(fab) fab.remove();
}

function renderAll(){
  renderTopBar();
  renderContent();
}
