// EVENT FORM MODAL
// ═══════════════════════════════════════════════════════════════
function openEventModal(dateStr='', existing=null){
  if(!S.isAdmin){S.showPanel=true;renderPanel();return}
  const today=todayStr();
  const isEdit = !!existing;
  let form = isEdit ? {
    event_id:   existing.event_id,
    title:      existing.title || '',
    start_date: normDate(existing.start_date) || today,
    start_time: normTime(existing.start_time) || '',
    end_date:   normDate(existing.end_date) || normDate(existing.start_date) || today,
    end_time:   normTime(existing.end_time) || '',
    color:      existing.color || '#7C3AED',
    assigned_to:existing.assigned_to || '',
    description:existing.description || '',
  } : {
    title:'',
    start_date: dateStr||today,
    start_time: '',
    end_date:   dateStr||today,
    end_time:   '',
    color:      '#7C3AED',
    assigned_to:'',
    description:'',
  };
  const colors=['#7C3AED','#2563EB','#DB2777','#059669','#E8521A','#D97706','#DC2626'];

  // Keep named refs so start date change can sync end date input visually
  const startDateInput = r('input',{class:'finput',type:'date',value:form.start_date,
    onInput:e=>{
      form.start_date=e.target.value;
      if(!endDateInput.dataset.userEdited){
        form.end_date=e.target.value;
        endDateInput.value=e.target.value;
      } else if(endDateInput.value && endDateInput.value < e.target.value){
        form.end_date=e.target.value;
        endDateInput.value=e.target.value;
        endDateInput.style.borderColor='';
        endDateError.style.display='none';
      }
    }
  });
  const endDateError = r('div',{
    id:'end-date-error',
    style:{color:'var(--red)',fontSize:'.75rem',fontWeight:700,
           marginTop:4,display:'none'}
  },'⚠️ End date cannot be before start date');

  const endDateInput = r('input',{class:'finput',type:'date',value:form.end_date,
    onInput:e=>{
      form.end_date=e.target.value;
      endDateInput.dataset.userEdited='1';
      if(form.end_date && form.start_date && form.end_date < form.start_date){
        endDateInput.style.borderColor='var(--red)';
        endDateError.style.display='block';
      } else {
        endDateInput.style.borderColor='';
        endDateError.style.display='none';
      }
    }
  });
  const startTimeInput = r('input',{class:'finput',type:'time',value:form.start_time,
    onInput:e=>{ form.start_time=e.target.value; }
  });
  const endTimeInput = r('input',{class:'finput',type:'time',value:form.end_time,
    onInput:e=>{ form.end_time=e.target.value; }
  });
  const titleInput = r('input',{class:'finput',placeholder:'e.g. Soccer Practice',value:form.title,
    onInput:e=>{ form.title=e.target.value; }
  });
  const assignSelect = r('select',{class:'fselect',onInput:e=>{ form.assigned_to=e.target.value; }},
    r('option',{value:''},'👨‍👩‍👧‍👦 Whole Family'),
    ...S.users.map(u=>{
      const o=r('option',{value:u.user_id},u.avatar+' '+u.name);
      if(form.assigned_to===u.user_id) o.selected=true;
      return o;
    })
  );

  const colorSwatches = colors.map(c=>{
    const btn=r('button',{
      'aria-label':'Event color '+c,
      style:{width:28,height:28,borderRadius:'50%',background:c,
        border:'3px solid '+(form.color===c?'var(--text)':'transparent'),
        cursor:'pointer'},
      onClick:()=>{
        form.color=c;
        colorSwatches.forEach(b=>{
          b.style.border='3px solid '+(b.dataset.color===c?'var(--text)':'transparent');
        });
      }
    });
    btn.dataset.color=c;
    return btn;
  });

  async function saveEvent(){
    if(!form.title.trim())return;
    form.start_date = startDateInput.value || form.start_date;
    form.end_date   = endDateInput.value   || form.end_date;
    form.start_time = startTimeInput.value || form.start_time;
    form.end_time   = endTimeInput.value   || form.end_time;
    if(form.end_date && form.start_date && form.end_date < form.start_date){
      endDateInput.style.borderColor='var(--red)';
      endDateError.style.display='block';
      endDateInput.scrollIntoView({behavior:'smooth',block:'center'});
      return;
    }
    if(form.end_date===form.start_date && form.end_time && form.start_time && form.end_time < form.start_time){
      endTimeInput.style.borderColor='var(--red)';
      showToast('End time cannot be before start time',false);
      return;
    }
    try{
      if(isEdit) await API.updateEvent(form);
      else       await API.addEvent(form);
      const data=await API.readAll();if(data)S.events=data.events||[];
      mount('modal-mount',null);showToast(isEdit?'Event updated!':'Event added!');renderContent();
    }catch(e){showToast(e.message,false);}
  }

  const deleteBtn = isEdit ? r('button',{class:'btn btn-secondary',
    style:{color:'var(--red)',borderColor:'var(--red)'},
    onClick:async()=>{
      if(!confirm('Delete "'+form.title+'"? This cannot be undone.'))return;
      try{
        await API.deleteEvent(form.event_id);
        S.events=S.events.filter(e=>e.event_id!==form.event_id);
        mount('modal-mount',null);showToast('Event deleted.');renderContent();
      }catch(e){showToast(e.message,false);}
    }},'🗑️') : null;

  const modal=r('div',{class:'modal-bg',onClick:e=>{if(e.target===e.currentTarget)mount('modal-mount',null)}},
    r('div',{class:'modal',role:'dialog','aria-label':isEdit?'Edit event':'New event'},
      r('div',{class:'modal-hdr'},
        r('div',{class:'modal-title'},isEdit?'✏️ Edit Event':'📅 New Event'),
        r('button',{class:'modal-close','aria-label':'Close',onClick:()=>mount('modal-mount',null)},'✕')
      ),
      r('div',{class:'fgroup'},r('label',{class:'flabel'},'Title *'),titleInput),
      r('div',{class:'frow'},
        r('div',{class:'fgroup',style:{marginBottom:0}},r('label',{class:'flabel'},'Start Date'),startDateInput),
        r('div',{class:'fgroup',style:{marginBottom:0}},r('label',{class:'flabel'},'Start Time'),startTimeInput)
      ),
      r('div',{class:'frow',style:{marginTop:8}},
        r('div',{class:'fgroup',style:{marginBottom:0}},r('label',{class:'flabel'},'End Date'),endDateInput,endDateError),
        r('div',{class:'fgroup',style:{marginBottom:0}},r('label',{class:'flabel'},'End Time'),endTimeInput)
      ),
      r('div',{class:'fgroup',style:{marginTop:8}},r('label',{class:'flabel'},'Assign To'),assignSelect),
      r('div',{class:'fgroup'},r('label',{class:'flabel'},'Color'),
        r('div',{style:{display:'flex',gap:7,flexWrap:'wrap'}},...colorSwatches)
      ),
      r('div',{style:{display:'flex',gap:10,marginTop:4}},
        deleteBtn,
        r('button',{class:'btn btn-secondary',style:{flex:1},onClick:()=>mount('modal-mount',null)},'Cancel'),
        r('button',{class:'btn btn-primary',style:{flex:2},onClick:saveEvent},
          isEdit?'💾 Save Changes':'📅 Add Event')
      )
    )
  );
  mount('modal-mount',modal);
}

// TASK CARD COMPONENT
// ═══════════════════════════════════════════════════════════════
function buildTaskCard(task, opts={}){
  const user=getUser(task.assigned_to);
  const done=task.status==='completed';
  const overdue=isOverdue(task);
  const color=overdue?'var(--red)':done?'var(--green)':user?.color||'var(--accent)';

  const check=r('div',{class:`tcheck${done?' on':''}`,onClick:async e=>{
    e.stopPropagation();
    if(!S.isAdmin&&!S.currentUser){S.showPanel=true;renderPanel();return}
    try{
      if(done) await API.reopenTask(task.task_id);
      else { await API.completeTask(task.task_id); if(!done)launchConfetti(); showToast(done?'Reopened!':'Task done! 🎉'); }
      const data=await API.readAll();if(data){S.tasks=data.tasks||[];S.rewards=data.rewards||[];}
      renderContent();
    }catch(e){showToast(e.message,false);}
  }}, done?'✓':'');

  const meta=[
    user?r('span',{style:{color:user.color,fontWeight:700}},`${user.avatar} ${user.name}`):null,
    task.due_date?r('span',{},fmtDate(task.due_date)):null,
    task.due_time?r('span',{},`🕐 ${fmt12(task.due_time)}`):null,
    r('span',{class:`tag tag-${task.priority?.toLowerCase()==='high'?'high':task.priority?.toLowerCase()==='medium'?'med':'low'}`},task.priority||''),
    overdue?r('span',{class:'tag tag-over'},'⚠️ Late'):null,
    done?r('span',{class:'tag tag-done'},'✓ Done'):null,
    task.reward_points>0?r('span',{},`⭐ ${task.reward_points}`):null,
    task.recurrence&&task.recurrence!=='None'?r('span',{style:{color:'var(--text3)'}},`🔁 ${task.recurrence.replace('Custom:','')}`):null,
  ].filter(Boolean);

  const actions=S.isAdmin?r('div',{class:'tactions'},
    r('button',{class:'icon-btn',style:{width:28,height:28,fontSize:13},onClick:e=>{e.stopPropagation();openTaskModal(task)}},'✏️'),
    r('button',{class:'icon-btn',style:{width:28,height:28,fontSize:13,color:'var(--red)'},onClick:async e=>{
      e.stopPropagation();
      if(!confirm('Delete this task?'))return;
      try{await API.deleteTask(task.task_id);S.tasks=S.tasks.filter(t=>t.task_id!==task.task_id);renderContent();showToast('Deleted.');}
      catch(e){showToast(e.message,false);}
    }},'🗑️')
  ):null;

  return r('div',{class:`tcard${done?' done':''}`},
    r('div',{class:'tbar',style:{background:color}}),
    check,
    r('div',{class:'tbody'},
      r('div',{class:'ttitle'},`${catIcon(task.category)} ${task.title}`),
      r('div',{class:'tmeta'},...meta)
    ),
    actions
  );
}

function timeToMins(t){if(!t)return 0;const[h,m]=t.split(':').map(Number);return h*60+m;}

// ── SKYLIGHT TIME-GRID CALENDAR ──────────────────────────────
function buildSkylightCalendar(opts){
  opts = opts || {};
  const filterUser  = opts.filterUser  !== undefined ? opts.filterUser  : S.calFilter;
  const showFilter  = opts.showFilter  !== undefined ? opts.showFilter  : true;
  const showAddBtn  = opts.showAddBtn  !== undefined ? opts.showAddBtn  : S.isAdmin;
  const onFilterChange = opts.onFilterChange || function(uid){ S.calFilter=uid; };

  const today  = new Date();
  const tdStr  = localDateStr(today);
  const sel    = S.calSelectedDate;
  const ws     = new Date(sel); ws.setDate(ws.getDate()-ws.getDay());
  const weekDays = Array.from({length:7},(_,i)=>{ const d=new Date(ws); d.setDate(d.getDate()+i); return d; });
  const START=5, END=22, HOURS=Array.from({length:END-START},(_,i)=>START+i);
  // Dynamic hour height: fit all 14 hours on screen without scrolling
  const OVERHEAD = 320; // topbar + bottomnav + nav + chips + headers + padding
  const availH = (window.innerHeight || 700) - OVERHEAD;
  const HH = Math.max(26, Math.min(52, Math.floor(availH / HOURS.length)));
  const TOTAL = (END-START)*60;
  const nowMins = today.getHours()*60+today.getMinutes();
  const nowTop  = ((nowMins-START*60)/TOTAL)*HOURS.length*HH;
  const showNow = today.getHours()>=START && today.getHours()<END;
  const cols = weekDays.length;

  // Filter tasks/events by selected user
  function filteredTasks(ds){
    return S.tasks.filter(t => taskOccursOn(t, ds) && (filterUser==='all' || t.assigned_to===filterUser));
  }
  function filteredEvents(ds){
    return S.events.filter(e => normDate(e.start_date)===ds && (filterUser==='all' || !e.assigned_to || e.assigned_to==='' || e.assigned_to===filterUser));
  }

  // ── Member filter chips ──
  function buildFilterChips(containerId){
    const chips = r('div',{id:containerId, class:'sky-member-chips',style:{padding:'6px 0 4px'}},
      r('button',{
        class:'sky-chip'+(filterUser==='all'?' active':''),
        style:filterUser==='all'?{background:'var(--accbg)',borderColor:'var(--accent)',color:'var(--accent)'}:{},
        onClick:()=>{ onFilterChange('all'); }
      },'👨‍👩‍👧‍👦 Everyone'),
      ...S.users.map(u=>{
        const p=getUserPastel(u.user_id);
        const isOn=filterUser===u.user_id;
        return r('button',{
          class:'sky-chip'+(isOn?' active':''),
          style:isOn?{background:p.bg,borderColor:p.border,color:p.text}:{},
          onClick:()=>{ onFilterChange(u.user_id); }
        }, r('span',{style:{fontSize:'.9rem'}},u.avatar), u.name);
      })
    );
    return chips;
  }

  // ── Nav bar ──
  const nav = r('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'10px 12px 6px',flexWrap:'wrap',gap:6}},
    r('div',{style:{display:'flex',gap:5,alignItems:'center'}},
      r('button',{style:{background:'none',border:'1.5px solid var(--border)',borderRadius:8,padding:'5px 11px',cursor:'pointer',fontSize:'.78rem',fontWeight:700,color:'var(--text2)'},
        onClick:()=>{ const d=new Date(ws);d.setDate(d.getDate()-7);S.calSelectedDate=d; opts.onNavigate&&opts.onNavigate(); }},'< Prev'),
      r('button',{style:{background:'var(--accbg)',border:'1.5px solid var(--accent)',borderRadius:8,padding:'5px 11px',cursor:'pointer',fontSize:'.78rem',fontWeight:700,color:'var(--accent)'},
        onClick:()=>{ S.calSelectedDate=new Date(); opts.onNavigate&&opts.onNavigate(); }},'Today'),
      r('button',{style:{background:'none',border:'1.5px solid var(--border)',borderRadius:8,padding:'5px 11px',cursor:'pointer',fontSize:'.78rem',fontWeight:700,color:'var(--text2)'},
        onClick:()=>{ const d=new Date(ws);d.setDate(d.getDate()+7);S.calSelectedDate=d; opts.onNavigate&&opts.onNavigate(); }},'Next >')
    ),
    r('div',{style:{textAlign:'center',flex:'1',minWidth:120}},
      r('div',{style:{fontFamily:"'DM Sans',sans-serif",fontSize:'.95rem',fontWeight:800,color:'var(--text)'}},
        weekDays[3].toLocaleDateString([],{month:'long',year:'numeric'})
      ),
      r('div',{style:{fontSize:'.7rem',color:'var(--text3)',fontWeight:600}},
        weekDays[0].toLocaleDateString([],{month:'short',day:'numeric'})+' – '+weekDays[6].toLocaleDateString([],{month:'short',day:'numeric'})
      )
    ),
    showAddBtn ? r('button',{class:'btn btn-primary',style:{padding:'5px 12px',fontSize:'.75rem'},
      onClick:()=>openEventModal(tdStr)},'+ Event') : null
  );

  // ── Day headers ──
  const dayHdr = r('div',{class:'sky-week-header',style:{gridTemplateColumns:'44px repeat('+cols+',1fr)'}},
    r('div',{style:{width:44,borderRight:'1px solid var(--border)'}}),
    ...weekDays.map((d,di)=>{
      const ds=localDateStr(d);
      const isT=ds===tdStr;
      const showMonth=d.getDate()===1||di===0;
      return r('div',{class:'sky-day-hdr'},
        r('div',{class:'sky-day-name'},d.toLocaleDateString([],{weekday:'short'})),
        r('div',{style:{display:'flex',alignItems:'center',justifyContent:'center',gap:3}},
          r('div',{class:'sky-day-num'+(isT?' today':''),onClick:()=>{S.calSelectedDate=d;opts.onNavigate&&opts.onNavigate();}},d.getDate()),
          showMonth?r('div',{style:{fontSize:'.6rem',fontWeight:700,color:isT?'var(--accent)':'var(--text3)',letterSpacing:'.02em',marginTop:1}},d.toLocaleDateString([],{month:'short'})):null
        )
      );
    })
  );

  // ── All-day row (events + tasks without time) ──
  const allDayEvts  = weekDays.map(d=>filteredEvents(localDateStr(d)).filter(e=>!e.start_time));
  const allDayTasks = weekDays.map(d=>filteredTasks(localDateStr(d)).filter(t=>!t.due_time||t.due_time===''));
  const hasAllDay   = allDayEvts.some(a=>a.length>0)||allDayTasks.some(a=>a.length>0);
  const allDayRow   = hasAllDay ? r('div',{class:'sky-allday-row',style:{gridTemplateColumns:'44px repeat('+cols+',1fr)'}},
    r('div',{style:{width:44,borderRight:'1px solid var(--border)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'.58rem',color:'var(--text3)',padding:2,flexDirection:'column',gap:1}},r('span',{},'all'),r('span',{},'day')),
    ...weekDays.map((_,di)=>r('div',{class:'sky-allday-cell'},
      ...allDayEvts[di].map(ev=>{
        const u=ev.assigned_to?getUser(ev.assigned_to):null;
        const p=u?getUserPastel(u.user_id):{bg:'var(--bg2)',border:'var(--border)',text:'var(--text2)'};
        return r('div',{class:'sky-allday-ev',
          style:{background:p.bg,color:p.text,borderLeft:'3px solid '+p.border,cursor:S.isAdmin?'pointer':'default'},
          title:S.isAdmin?'Tap to edit':ev.title,
          onClick:()=>{ if(S.isAdmin) openEventModal('', ev); }},
          ev.title+(u?' '+u.avatar:'')
        );
      }),
      ...allDayTasks[di].map(t=>{
        const u=getUser(t.assigned_to);
        const p=u?getUserPastel(u.user_id):{bg:'var(--bg2)',border:'var(--border)',text:'var(--text2)'};
        const done=t.status==='completed';
        return r('div',{class:'sky-allday-ev',
          style:{background:done?'var(--greenbg)':p.bg,color:done?'var(--green)':p.text,
            borderLeft:'3px solid '+(done?'var(--green)':p.border),
            textDecoration:done?'line-through':'none',cursor:'pointer'},
          onClick:async()=>{
            if(!S.isAdmin&&!S.currentUser){S.showPanel=true;renderPanel();return;}
            if(!done){try{await API.completeTask(t.task_id);launchConfetti();showToast('Done!');const data=await API.readAll();if(data){S.tasks=data.tasks||[];S.rewards=data.rewards||[];}renderContent();}catch(e){showToast(e.message,false);}}
          }
        },catIcon(t.category)+' '+t.title+(u?' · '+u.avatar+' '+u.name:''));
      })
    ))
  ):null;

  // ── Time column ──
  const timeCol = r('div',{class:'sky-time-col'},
    ...HOURS.map(h=>r('div',{class:'sky-time-label',style:{height:HH+'px'}},h<12?h+' AM':h===12?'12 PM':(h-12)+' PM'))
  );

  // ── Day columns ──
  const dayCols = r('div',{class:'sky-day-cols',style:{gridTemplateColumns:'repeat('+cols+',1fr)'}},
    ...weekDays.map((d,di)=>{
      const ds=localDateStr(d);
      const isT=ds===tdStr;
      const evts  = filteredEvents(ds).filter(e=>e.start_time);
      const tasks = filteredTasks(ds).filter(t=>t.due_time);

      const hourRows = HOURS.map(h=>r('div',{class:'sky-hour-row',
        style:{height:HH+'px',background:isT&&h===today.getHours()?'rgba(224,90,58,0.025)':''}}));

      // Event blocks — with side-by-side lanes when events overlap
      const evMeta = evts.map(ev=>{
        const sm=timeToMins(ev.start_time);
        const em=Math.max(sm+15, ev.end_time?timeToMins(ev.end_time):sm+60);
        return {ev, sm, em, lane:0, lanes:1};
      }).sort((a,b)=>a.sm-b.sm||a.em-b.em);
      // Greedy lane assignment within overlapping clusters
      {
        let cluster=[]; let clusterEnd=-1;
        const flush=()=>{ const n=Math.max(1,...cluster.map(m=>m.lane+1)); cluster.forEach(m=>m.lanes=n); cluster=[]; };
        evMeta.forEach(m=>{
          if(cluster.length && m.sm>=clusterEnd) flush();
          const used=cluster.filter(c=>c.em>m.sm).map(c=>c.lane);
          let lane=0; while(used.includes(lane)) lane++;
          m.lane=lane; cluster.push(m); clusterEnd=Math.max(clusterEnd,m.em);
        });
        if(cluster.length) flush();
      }
      const evtBlocks = evMeta.map(({ev,sm,em,lane,lanes})=>{
        const u=ev.assigned_to?getUser(ev.assigned_to):null;
        const p=u?getUserPastel(u.user_id):{bg:'var(--bg2)',border:'var(--border)',text:'var(--text2)'};
        const top=Math.max(0,(sm-START*60)/60*HH);
        const ht=Math.max(24,(em-sm)/60*HH-2);
        const widthPct=100/lanes, leftPct=lane*widthPct;
        return r('div',{class:'sky-event'+(S.isAdmin?' editable':''),
          title:S.isAdmin?'Tap to edit':ev.title,
          style:{top:top+'px',height:ht+'px',
            left:'calc('+leftPct+'% + 2px)', right:'auto',
            width:'calc('+widthPct+'% - 4px)',
            background:p.bg,borderLeft:'3px solid '+p.border,color:p.text,
            cursor:S.isAdmin?'pointer':'default'},
          onClick:()=>{ if(S.isAdmin) openEventModal('', ev); }},
          r('div',{class:'sky-event-title'},ev.title),
          ht>28?r('div',{class:'sky-event-time'},
            (u?u.avatar+' '+u.name:'')+(ev.start_time?' · '+fmt12(ev.start_time)+(ev.end_time?' – '+fmt12(ev.end_time):''):'')
          ):null,
          u&&lanes===1?r('div',{class:'sky-event-av',style:{background:p.bg}},u.avatar):null
        );
      });

      // Task blocks
      const taskBlocks = tasks.map(t=>{
        const u=getUser(t.assigned_to);
        const p=u?getUserPastel(u.user_id):{bg:'var(--bg2)',border:'var(--border)',text:'var(--text2)'};
        const sm=timeToMins(t.due_time);
        const top=Math.max(0,(sm-START*60)/60*HH);
        const ht=52;
        const done=t.status==='completed';
        // Future occurrence of a recurring task (not today's instance): preview only
        const ghost = normDate(t.due_date)!==ds;
        return r('div',{class:'sky-event',
          style:{top:top+'px',height:ht+'px',
            background:done?'var(--greenbg)':p.bg,
            borderLeft:'3px '+(ghost?'dashed':'solid')+' '+(done?'var(--green)':p.border),
            color:done?'var(--green)':p.text,
            opacity:ghost?.55:(done?.65:1)},
          title:ghost?'Upcoming — repeats '+String(t.recurrence).replace('Custom:',''):'',
          onClick:async()=>{
            if(ghost){showToast('🔁 Repeats — complete it on its day');return;}
            if(!S.isAdmin&&!S.currentUser){S.showPanel=true;renderPanel();return;}
            if(!done){try{await API.completeTask(t.task_id);launchConfetti();showToast('Done!');const data=await API.readAll();if(data){S.tasks=data.tasks||[];S.rewards=data.rewards||[];}renderContent();}catch(e){showToast(e.message,false);}}
          }},
          r('div',{class:'sky-event-title',style:{textDecoration:done?'line-through':'none'}},
            catIcon(t.category)+' '+t.title
          ),
          r('div',{class:'sky-event-time'},
            (u?u.avatar+' '+u.name:'')+(t.due_time?' · '+fmt12(t.due_time):'')
          ),
          u?r('div',{class:'sky-event-av',style:{background:done?'var(--greenbg)':p.bg}},u.avatar):null
        );
      });

      const nowLine=(isT&&showNow)?r('div',{class:'sky-now-line',style:{top:nowTop+'px'}}):null;
      return r('div',{class:'sky-day-col',style:{minHeight:HOURS.length*HH+'px'}},
        ...hourRows,...evtBlocks,...taskBlocks,nowLine);
    })
  );

  const gridBody = r('div',{class:'sky-grid-wrap'},
    timeCol,
    r('div',{style:{flex:1,position:'relative'}},dayCols)
  );

  const container = r('div',{style:{background:'var(--surface)',borderRadius:'var(--r)',border:'1px solid var(--border)',overflow:'hidden',boxShadow:'var(--sh)',marginTop:10}},
    r('div',{style:{padding:'0 12px'}},nav),
    showFilter ? r('div',{style:{padding:'0 12px',borderBottom:'1px solid var(--border)'}},buildFilterChips('cal-filter-'+Math.random().toString(36).slice(2))) : null,
    dayHdr,
    allDayRow,
    gridBody
  );
  return container;
}

// ── TASKS VIEW ──
function buildTasks(){
  let filterUser='all',filterStatus='all',filterCat='all';

  function draw(){
    const filtered=S.tasks.filter(t=>{
      if(filterUser!=='all'&&t.assigned_to!==filterUser)return false;
      if(filterStatus==='pending'&&t.status!=='pending')return false;
      if(filterStatus==='completed'&&t.status!=='completed')return false;
      if(filterStatus==='overdue'&&!isOverdue(t))return false;
      if(filterCat!=='all'&&t.category!==filterCat)return false;
      return true;
    }).sort((a,b)=>a.due_date<b.due_date?-1:a.due_date>b.due_date?1:0);

    const statusPills=['all','pending','completed','overdue'].map(s=>
      r('button',{class:`ps-pill${filterStatus===s?' on':''}`,onClick:()=>{filterStatus=s;draw()}},
        s==='all'?'All':s==='overdue'?'⚠️ Overdue':s.charAt(0).toUpperCase()+s.slice(1)
      )
    );
    const userPills=[
      r('button',{class:`ps-pill${filterUser==='all'?' on':''}`,onClick:()=>{filterUser='all';draw()}},'Everyone'),
      ...S.users.map(u=>r('button',{class:`ps-pill${filterUser===u.user_id?' on':''}`,
        style:filterUser===u.user_id?{background:u.color,borderColor:u.color}:{},
        onClick:()=>{filterUser=u.user_id;draw()}},`${u.avatar} ${u.name}`))
    ];
    const catPills=[
      r('button',{class:`ps-pill${filterCat==='all'?' on':''}`,onClick:()=>{filterCat='all';draw()}},'📋 All'),
      ...allCats().map(c=>r('button',{class:`ps-pill${filterCat===c.n?' on':''}`,onClick:()=>{filterCat=c.n;draw()}},`${c.i} ${c.n}`))
    ];

    const wrap=document.getElementById('tasks-inner');
    if(!wrap)return;
    wrap.innerHTML='';

    wrap.appendChild(r('div',{class:'sh',style:{marginTop:4}},
      r('div',{class:'sh-title'},'All Tasks'),
      r('button',{class:'btn btn-primary',style:{padding:'6px 14px',fontSize:'.8rem'},onClick:()=>openTaskModal()},'+ New Task')
    ));
    const filterWrap=r('div',{style:{marginBottom:12}},
      r('div',{class:'pill-select',style:{marginBottom:7}},...statusPills),
      r('div',{class:'pill-select',style:{marginBottom:7}},...userPills),
      r('div',{class:'pill-select',style:{marginBottom:7}},...catPills)
    );
    wrap.appendChild(filterWrap);
    wrap.appendChild(r('div',{style:{fontSize:'.78rem',color:'var(--text3)',fontWeight:700,marginBottom:8}},`${filtered.length} tasks`));
    if(!filtered.length) wrap.appendChild(r('div',{style:{textAlign:'center',padding:'32px 0',color:'var(--text3)'}},'No tasks match filters'));
    filtered.forEach(t=>wrap.appendChild(buildTaskCard(t)));
  }

  const outer=r('div',{class:'anim-in'},r('div',{id:'tasks-inner'}));
  // draw after mounted
  setTimeout(draw,0);
  return outer;
}

// ── CALENDAR VIEW (full) ──
function buildCalendarFull(){
  const today=new Date();
  let viewDate=new Date(S.calSelectedDate);
  let mode=S.calViewMode;

  function draw(){
    const wrap=document.getElementById('cal-inner');
    if(!wrap)return;
    wrap.innerHTML='';
    S.calViewMode=mode;

    // ── Header with mode toggle + add event ──
    const hdr=r('div',{class:'sh',style:{marginTop:4,marginBottom:8}},
      r('div',{class:'sh-title'},'📅 Calendar'),
      r('div',{style:{display:'flex',gap:6,alignItems:'center'}},
        r('button',{class:'ps-pill'+(mode==='week'?' on':''),onClick:()=>{mode='week';S.calSelectedDate=viewDate;draw()}},'Week'),
        r('button',{class:'ps-pill'+(mode==='month'?' on':''),onClick:()=>{mode='month';draw()}},'Month'),
        S.isAdmin?r('button',{class:'btn btn-primary',style:{padding:'5px 11px',fontSize:'.75rem'},
          onClick:()=>openEventModal(localDateStr(viewDate))},'+ Event'):null
      )
    );
    wrap.appendChild(hdr);

    if(mode==='week'){
      // Use the shared Skylight time-grid
      S.calSelectedDate=viewDate;
      const grid=buildSkylightCalendar({
        showAddBtn: false, // already in header above
        onNavigate:()=>{
          viewDate=new Date(S.calSelectedDate);
          draw();
        },
        onFilterChange:(uid)=>{
          S.calFilter=uid;
          draw();
        },
      });
      wrap.appendChild(grid);

    } else {
      // Month grid view
      const y=viewDate.getFullYear(), m=viewDate.getMonth();
      const firstDay=new Date(y,m,1).getDay();
      const daysInMonth=new Date(y,m+1,0).getDate();
      const tdStr=localDateStr(today);

      const nav=r('div',{class:'cal-nav',style:{marginBottom:10}},
        r('button',{class:'cal-nav-btn',onClick:()=>{viewDate=new Date(y,m-1,1);draw()}},'‹'),
        r('div',{class:'cal-nav-title'},new Date(y,m).toLocaleDateString([],{month:'long',year:'numeric'})),
        r('button',{class:'cal-nav-btn',onClick:()=>{viewDate=new Date(y,m+1,1);draw()}},'›')
      );
      wrap.appendChild(nav);

      // Month filter chips
      const filterChips=r('div',{class:'sky-member-chips',style:{marginBottom:10}},
        r('button',{
          class:'sky-chip'+(S.calFilter==='all'?' active':''),
          style:S.calFilter==='all'?{background:'var(--accbg)',borderColor:'var(--accent)',color:'var(--accent)'}:{},
          onClick:()=>{S.calFilter='all';draw();}
        },'👨‍👩‍👧‍👦 Everyone'),
        ...S.users.map(u=>{
          const p=getUserPastel(u.user_id);
          const isOn=S.calFilter===u.user_id;
          return r('button',{
            class:'sky-chip'+(isOn?' active':''),
            style:isOn?{background:p.bg,borderColor:p.border,color:p.text}:{},
            onClick:()=>{S.calFilter=u.user_id;draw();}
          },r('span',{style:{fontSize:'.9rem'}},u.avatar),u.name);
        })
      );
      wrap.appendChild(filterChips);

      const grid=r('div',{class:'month-grid'},
        ...['Su','Mo','Tu','We','Th','Fr','Sa'].map(d=>r('div',{class:'month-hdr'},d)),
        ...Array.from({length:firstDay},()=>r('div',{class:'month-day other-month'})),
        ...Array.from({length:daysInMonth},(_,i)=>{
          const day=i+1;
          const ds=y+'-'+String(m+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');
          const tasks=S.tasks.filter(t=>taskOccursOn(t,ds)&&(S.calFilter==='all'||t.assigned_to===S.calFilter));
          const evts=S.events.filter(e=>normDate(e.start_date)===ds&&(S.calFilter==='all'||!e.assigned_to||e.assigned_to===''||e.assigned_to===S.calFilter));
          const cls='month-day'+(ds===tdStr?' today':'');
          return r('div',{class:cls,
            onClick:()=>{viewDate=new Date(y,m,day);S.calSelectedDate=new Date(y,m,day);mode='week';draw();}},
            r('div',{class:'mday-num'},day),
            ...evts.slice(0,2).map(ev=>{
              const u=ev.assigned_to?getUser(ev.assigned_to):null;
              const p=u?getUserPastel(u.user_id):{bg:'var(--accent)',border:'var(--accent)',text:'#fff'};
              return r('div',{style:{fontSize:'.6rem',fontWeight:700,background:p.bg,color:p.text,borderRadius:3,padding:'1px 4px',marginBottom:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},ev.title);
            }),
            ...tasks.slice(0,evts.length>=2?0:2-evts.length).map(t=>{
              const u=getUser(t.assigned_to);
              const p=u?getUserPastel(u.user_id):{bg:'var(--bg2)',border:'var(--border)',text:'var(--text2)'};
              return r('div',{style:{fontSize:'.6rem',fontWeight:700,background:p.bg,color:p.text,borderRadius:3,padding:'1px 4px',marginBottom:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}},catIcon(t.category)+' '+t.title);
            }),
            (evts.length+tasks.length)>2?r('div',{style:{fontSize:'.6rem',color:'var(--text3)',fontWeight:700}},
              '+'+(evts.length+tasks.length-2)+' more'
            ):null
          );
        })
      );
      wrap.appendChild(grid);
    }
  }

  const outer=r('div',{class:'anim-in'},r('div',{id:'cal-inner'}));
  setTimeout(draw,0);
  return outer;
}

          r('span',{style:{fontSize:'1.2rem'}},group.icon),

// ── REWARDS VIEW ──
function buildRewards(){
  const kids=S.users.filter(u=>u.role==='child'||userPoints(u.user_id)>0).map(u=>({
    ...u,
    pts:userPoints(u.user_id),
    done:S.tasks.filter(t=>t.assigned_to===u.user_id&&t.status==='completed').length,
    todayPts:S.rewards.filter(r=>r.user_id===u.user_id&&r.date===todayStr()).reduce((s,r)=>s+(Number(r.points)||0),0),
  })).sort((a,b)=>b.pts-a.pts);

  const maxPts=Math.max(...kids.map(k=>k.pts),1);
  const leaderboard=kids.map((u,i)=>r('div',{class:'lb-item',style:i===0?{borderColor:'#F6C026'}:{}},
    r('div',{class:'lb-rank'},i===0?'🥇':i===1?'🥈':i===2?'🥉':`#${i+1}`),
    r('div',{class:'av av-md',style:{color:u.color,borderColor:u.color,background:u.color+'22'}},u.avatar),
    r('div',{style:{flex:1}},
      r('div',{style:{fontWeight:800,fontSize:'.92rem'}},u.name),
      r('div',{style:{fontSize:'.72rem',color:'var(--text3)'}},`${u.done} done · +${u.todayPts} today`),
      r('div',{class:'lb-bar'},r('div',{class:'pbar-fill',style:{width:`${Math.round(u.pts/maxPts*100)}%`,background:u.color,height:'100%'}}))
    ),
    r('span',{style:{background:'linear-gradient(135deg,#F6C026,#F5A623)',color:'#fff',padding:'5px 12px',borderRadius:99,fontWeight:800,fontSize:'.85rem',whiteSpace:'nowrap'}},`⭐ ${u.pts}`)
  ));

  const recent=[...S.rewards].sort((a,b)=>b.reward_id>a.reward_id?1:-1).slice(0,20).map(rw=>{
    const u=getUser(rw.user_id);
    return r('div',{style:{display:'flex',alignItems:'center',gap:10,padding:'10px 12px',background:'var(--surface)',borderRadius:10,border:'1.5px solid var(--border)',marginBottom:7}},
      u?r('div',{class:'av av-sm',style:{color:u.color,borderColor:u.color,background:u.color+'22'}},u.avatar):null,
      r('div',{style:{flex:1}},
        r('div',{style:{fontWeight:800,fontSize:'.85rem'}},u?.name||''),
        r('div',{style:{fontSize:'.73rem',color:'var(--text3)'}},`${rw.reason} · ${rw.date}`)
      ),
      r('span',{style:{background:'linear-gradient(135deg,#F6C026,#F5A623)',color:'#fff',padding:'3px 10px',borderRadius:99,fontWeight:800,fontSize:'.78rem'}},`⭐ +${rw.points}`)
    );
  });

  return r('div',{class:'anim-in'},
    r('div',{class:'sh',style:{marginTop:4}},r('div',{class:'sh-title'},'⭐ Rewards')),
    ...leaderboard,
    r('div',{class:'sh'},r('div',{class:'sh-title'},'📜 Recent')),
    recent.length?r('div',{},...recent):r('div',{style:{color:'var(--text3)',textAlign:'center',padding:'24px 0'}},'No rewards yet')
  );
}

// ── SETTINGS VIEW ──
// (The original Settings view was superseded by the enhanced Settings
//  further below — removed to avoid two competing definitions.)

function buildKidMode(){
  const u=S.currentUser;
  const td=todayStr();
  const myTasks=S.tasks.filter(t=>t.assigned_to===u.user_id&&t.due_date===td);
  const done=myTasks.filter(t=>t.status==='completed').length;
  const pct=myTasks.length?Math.round(done/myTasks.length*100):0;

  const header=r('div',{class:'kid-header',style:{background:`linear-gradient(135deg,${u.color},${u.color}BB)`}},
    r('div',{style:{fontSize:'2.8rem',marginBottom:6}},u.avatar),
    r('div',{style:{fontFamily:"'DM Sans',sans-serif",fontSize:'1.6rem',fontWeight:800}},`Hi, ${u.name}! 👋`),
    r('div',{style:{fontSize:'.85rem',opacity:.9,marginTop:3}},`${done}/${myTasks.length} done today 🎯`),
    r('div',{style:{marginTop:10,background:'rgba(255,255,255,.3)',borderRadius:99,height:10,overflow:'hidden'}},
      r('div',{style:{height:'100%',background:'#fff',borderRadius:99,width:`${pct}%`,transition:'width .5s'}})
    )
  );

  const cards=myTasks.map(task=>
    r('div',{class:`kid-card${task.status==='completed'?' done':''}`},
      r('div',{class:'kid-ico'},taskIcon(task.title)),
      r('div',{class:'kid-title'},task.title),
      task.due_time?r('div',{class:'kid-time'},`🕐 ${fmt12(task.due_time)}`):null,
      task.reward_points>0?r('div',{class:'kid-pts'},`⭐ ${task.reward_points} points!`):null,
      task.status==='completed'
        ?r('div',{style:{background:'var(--greenbg)',color:'var(--green)',borderRadius:10,padding:'11px',fontWeight:800,textAlign:'center'}},'✅ Done! Great job!')
        :r('button',{class:'kid-done-btn',onClick:async()=>{
          try{
            await API.completeTask(task.task_id);
            launchConfetti();showToast(`${task.reward_points>0?`⭐ +${task.reward_points} points! `:''}Great job!`);
            const data=await API.readAll();if(data){S.tasks=data.tasks||[];S.rewards=data.rewards||[];}
            renderContent();
          }catch(e){showToast(e.message,false);}
        }},'✅ Done!')
    )
  );

  if(!cards.length) return r('div',{},header,r('div',{style:{textAlign:'center',padding:'40px 24px'}},r('div',{style:{fontSize:'3.5rem',marginBottom:12}},'🎉'),r('div',{style:{fontFamily:"'DM Sans',sans-serif",fontSize:'1.4rem',fontWeight:800}},'All done!'),r('div',{style:{color:'var(--text3)',marginTop:6}},'Nothing left for today')));

  return r('div',{},header,r('div',{class:'kid-grid'},...cards));
}

function renderContent(){
  // Kid mode check
  if(S.currentUser&&S.currentUser.role==='child'&&!S.isAdmin&&S.activeTab!=='rewards'&&S.activeTab!=='settings'){
    mount('content', buildKidMode());
    // Minimal kid bottom nav
    const nav=r('nav',{class:'bottomnav'},
      r('button',{class:`navitem${S.activeTab==='home'?' on':''}`,onClick:()=>{S.activeTab='home';renderContent()}},r('span',{class:'navico'},'🏠'),'Tasks'),
      r('button',{class:`navitem${S.activeTab==='rewards'?' on':''}`,onClick:()=>{S.activeTab='rewards';renderContent()}},r('span',{class:'navico'},'⭐'),'Rewards'),
      r('button',{class:`navitem${S.activeTab==='settings'?' on':''}`,onClick:()=>{S.activeTab='settings';renderContent()}},r('span',{class:'navico'},'⚙️'),'Settings')
    );
    mount('bottomnav-mount',nav);
    // FAB hidden in kid mode
    const existingFab=document.querySelector('.fab');if(existingFab)existingFab.remove();
    return;
  }

  let view;
  switch(S.activeTab){
    case 'home':     view=buildHome(); break;
    case 'tasks':    view=buildTasks(); break;
    case 'calendar': view=buildCalendarFull(); break;
    case 'routines': view=buildRoutines(); break;
    case 'rewards':  view=buildRewards(); break;
    case 'settings': view=buildSettings(); break;
    default:         view=buildHome();
  }
  mount('content', view);
  renderBottomNav();

  // FAB
  const existingFab=document.querySelector('.fab');if(existingFab)existingFab.remove();
  if(S.isAdmin&&(S.activeTab==='home'||S.activeTab==='tasks')){
    const fab=r('button',{class:'fab',onClick:()=>openTaskModal(),title:'Add Task'},'+');
    document.getElementById('app').appendChild(fab);
  }
}

// ── WEATHER SIMULATION ──
const WEATHER_ICONS = {
  sunny: '☀️', cloudy: '⛅', rainy: '🌧️', stormy: '⛈️',
  snowy: '❄️', windy: '💨', foggy: '🌫️', partlyCloudy: '🌤️',
};
const CONDITIONS = ['sunny','partlyCloudy','cloudy','rainy'];
const HOURLY_DESC = { sunny:'Sunny', partlyCloudy:'Partly Cloudy', cloudy:'Cloudy', rainy:'Light Rain' };

function generateWeather() {
  const cond = CONDITIONS[Math.floor(Math.random() * CONDITIONS.length)];
  const baseTemp = 65 + Math.floor(Math.random() * 20);
  const hourly = Array.from({length: 12}, (_, i) => ({
    hour: (new Date().getHours() + i) % 24,
    ico: WEATHER_ICONS[CONDITIONS[Math.floor(Math.random() * CONDITIONS.length)]],
    temp: baseTemp + Math.floor(Math.random() * 8) - 4,
    precip: Math.floor(Math.random() * 40),
  }));
  const daily = ['Today','Mon','Tue','Wed','Thu','Fri','Sat'].map((day, i) => ({
    day,
    ico: WEATHER_ICONS[CONDITIONS[Math.floor(Math.random() * CONDITIONS.length)]],
    hi: baseTemp + Math.floor(Math.random() * 10) - 2,
    lo: baseTemp - 12 + Math.floor(Math.random() * 6),
  }));
  return {
    condition: cond,
    ico: WEATHER_ICONS[cond],
    temp: baseTemp,
    feelsLike: baseTemp - 3,
    humidity: 40 + Math.floor(Math.random() * 40),
    wind: 5 + Math.floor(Math.random() * 15),
    desc: HOURLY_DESC[cond],
    location: 'Ontario, CA',
    hourly, daily,
    updated: new Date(),
  };
}

if(!S.weather) S.weather = generateWeather();

// ── SCREENSAVER ──
function resetScreensaverTimer() {
  if(S.screensaverTimer) clearTimeout(S.screensaverTimer);
  if(S.screensaverActive) deactivateScreensaver();
  S.screensaverTimer = setTimeout(activateScreensaver, S.screensaverTimeout);
}
['mousemove','mousedown','keydown','touchstart','touchmove','scroll','click'].forEach(evt =>
  document.addEventListener(evt, resetScreensaverTimer, { passive: true })
);

function activateScreensaver() {
  if(S.screensaverActive) return;
  S.screensaverActive = true;
  const ss = document.createElement('div');
  ss.id = 'screensaver';
  // Random ambient color bg
  const colors = ['#0a0a15','#0f1a0f','#1a0f0f','#0f0f1a','#110f1a'];
  ss.style.background = colors[Math.floor(Math.random() * colors.length)];

  const clockEl = document.createElement('div');
  clockEl.className = 'ss-clock';
  clockEl.id = 'ss-clock';

  const dateEl = document.createElement('div');
  dateEl.className = 'ss-date';
  dateEl.id = 'ss-date';

  const weatherEl = document.createElement('div');
  weatherEl.className = 'ss-weather';
  if(S.weather) weatherEl.innerHTML = `${S.weather.ico} ${S.weather.temp}°F &nbsp;·&nbsp; ${S.weather.desc}`;

  const tapEl = document.createElement('div');
  tapEl.className = 'ss-tap';
  tapEl.textContent = 'Tap anywhere to wake';

  const gradient = document.createElement('div');
  gradient.className = 'ss-gradient';

  ss.appendChild(gradient);
  ss.appendChild(clockEl);
  ss.appendChild(dateEl);
  ss.appendChild(weatherEl);
  ss.appendChild(tapEl);

  function updateSSClock() {
    const now = new Date();
    if(document.getElementById('ss-clock')) {
      document.getElementById('ss-clock').textContent = now.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
      document.getElementById('ss-date').textContent = now.toLocaleDateString([], {weekday:'long', month:'long', day:'numeric'});
    }
  }
  updateSSClock();
  const ssInterval = setInterval(updateSSClock, 1000);
  ss._interval = ssInterval;

  ss.addEventListener('click', deactivateScreensaver);
  ss.addEventListener('keydown', deactivateScreensaver);

  document.body.appendChild(ss);
}

function deactivateScreensaver() {
  const ss = document.getElementById('screensaver');
  if(ss) { clearInterval(ss._interval); ss.remove(); }
  S.screensaverActive = false;
  resetScreensaverTimer();
}

    `Soccer Tournament Schedule
Ava Johnson - Age Group U10
Game 1: Saturday June 7, 9:00 AM at Riverside Park Field 2
Game 2: Sunday June 8, 11:30 AM at Riverside Park Field 1
Practice: Tuesday June 3, 4:00 PM at Community Center`,
    `From: Springfield Elementary
Subject: End of Year Events
Dear Families,
Field Day: Friday, June 6, 9:00 AM - 2:00 PM
Report Cards: Monday June 9
Summer Reading Sign-up: June 10`,
  ];

  let stage = 'upload'; // 'upload' | 'processing' | 'results'
  let parsedEvents = [];
  let selectedEvents = new Set();
  let inputText = '';

  function buildUploadStage() {
    return r('div', {class:'anim-in'},
      r('div', {class:'upload-zone', onClick: () => {
        inputText = SAMPLE_TEXTS[Math.floor(Math.random() * SAMPLE_TEXTS.length)];
        const ta = document.getElementById('ai-import-text');
        if(ta) { ta.value = inputText; }
      }},
        r('div', {class:'upload-ico'}, '🤖'),
        r('div', {class:'upload-text'}, 'Drop a file or click to pick'),
        r('div', {class:'upload-sub'}, 'PDF · Email · Photo · Sports Schedule · School Flyer')
      ),
      r('div', {style:{textAlign:'center', padding:'10px 0', color:'var(--text3)', fontSize:'.8rem', fontWeight:700}}, '— or paste text below —'),
      r('textarea', {id:'ai-import-text', class:'ftextarea', placeholder:'Paste schedule text, email, or flyer content here...', rows:6,
        onInput: e => { inputText = e.target.value; }
      }, ''),
      r('button', {class:'btn btn-accent btn-lg', style:{width:'100%', marginTop:8},
        onClick: () => {
          if(!inputText.trim()) {
            inputText = SAMPLE_TEXTS[0];
          }
          stage = 'processing';
          refreshAiModal();
          setTimeout(() => {
            parsedEvents = parseTextToEvents(inputText);
            selectedEvents = new Set(parsedEvents.map((_,i) => i));
            stage = 'results';
            refreshAiModal();
          }, 2200);
        }
      }, '✨ Extract Events with AI')
    );
  }

  function buildProcessingStage() {
    const msgs = ['Reading document...', 'Identifying dates & times...', 'Extracting events...', 'Generating summaries...'];
    let msgIdx = 0;
    const msgEl = r('div', {id:'ai-proc-msg', style:{fontSize:'.88rem', color:'var(--text3)', fontWeight:600}}, msgs[0]);
    const interval = setInterval(() => {
      msgIdx = (msgIdx + 1) % msgs.length;
      const el = document.getElementById('ai-proc-msg');
      if(el) el.textContent = msgs[msgIdx]; else clearInterval(interval);
    }, 500);
    return r('div', {class:'ai-processing anim-in'},
      r('div', {class:'ai-spinner'}),
      r('div', {class:'ai-dots'},
        r('div', {class:'ai-dot'}), r('div', {class:'ai-dot'}), r('div', {class:'ai-dot'})
      ),
      r('div', {style:{fontFamily:'var(--serif)', fontStyle:'italic', fontSize:'1.3rem', marginBottom:4}}, 'AI is working…'),
      msgEl
    );
  }

  function buildResultsStage() {
    if(!parsedEvents.length) {
      return r('div', {class:'anim-in', style:{textAlign:'center', padding:'32px 0', color:'var(--text3)'}},
        r('div', {style:{fontSize:'2.5rem', marginBottom:12}}, '🤷'),
        r('div', {style:{fontWeight:700}}, 'No events found'),
        r('div', {style:{fontSize:'.82rem', marginTop:6}}, 'Try a more detailed text with dates and times'),
        r('button', {class:'btn btn-secondary', style:{marginTop:16},
          onClick: () => { stage='upload'; inputText=''; refreshAiModal(); }
        }, '← Try again')
      );
    }

    const cards = parsedEvents.map((ev, i) => {
      const isSel = selectedEvents.has(i);
      const card = r('div', {class:`parsed-event-card${isSel?' selected':''}`,
        onClick: () => {
          if(selectedEvents.has(i)) selectedEvents.delete(i); else selectedEvents.add(i);
          refreshAiModal();
        }
      },
        r('div', {class:'parsed-check'}, isSel ? '✓' : ''),
        r('div', {style:{flex:1}},
          r('div', {style:{fontWeight:700, fontSize:'.9rem', marginBottom:4}}, ev.title),
          r('div', {style:{fontSize:'.76rem', color:'var(--text3)', fontWeight:600}},
            (ev.date ? `📅 ${fmtDate(ev.date)}` : '') + (ev.time ? ` · ⏰ ${fmt12(ev.time)}` : '') + (ev.loc ? ` · 📍 ${ev.loc}` : '')
          )
        )
      );
      return card;
    });

    return r('div', {class:'anim-in'},
      r('div', {style:{fontSize:'.82rem', color:'var(--text3)', fontWeight:700, marginBottom:12}},
        `Found ${parsedEvents.length} event${parsedEvents.length!==1?'s':''} — select which to import`
      ),
      ...cards,
      r('div', {style:{display:'flex', gap:10, marginTop:16}},
        r('button', {class:'btn btn-secondary', style:{flex:1},
          onClick: () => { stage='upload'; inputText=''; refreshAiModal(); }
        }, '← Try again'),
        r('button', {class:'btn btn-accent', style:{flex:2},
          onClick: async () => {
            let imported = 0;
            for(const i of selectedEvents) {
              const ev = parsedEvents[i];
              const newEv = {
                title: ev.title, start_date: ev.date || todayStr(),
                start_time: ev.time || '', end_date: ev.date || todayStr(),
                end_time: '', color: S.users[0]?.color || '#7C3AED',
                assigned_to: '', description: 'Imported via AI',
              };
              await API.addEvent(newEv);
              imported++;
            }
            const data = await API.readAll();
            if(data) { S.events = data.events || []; }
            mount('modal-mount', null);
            launchConfetti();
            showToast(`✨ Imported ${imported} event${imported!==1?'s':''}!`);
            renderContent();
          }
        }, `Import ${selectedEvents.size} Event${selectedEvents.size!==1?'s':''}`)
      )
    );
  }

  function refreshAiModal() {
    const body = document.getElementById('ai-modal-body');
    if(!body) return;
    body.innerHTML = '';
    let content;
    if(stage === 'upload') content = buildUploadStage();
    else if(stage === 'processing') content = buildProcessingStage();
    else content = buildResultsStage();
    body.appendChild(content);
  }

  const modal = r('div', {class:'modal-bg', onClick: e => { if(e.target===e.currentTarget) mount('modal-mount',null); }},
    r('div', {class:'modal'},
      r('div', {class:'modal-hdr'},
        r('div', {class:'modal-title'}, '✨ Magic Import'),
        r('button', {class:'modal-close', onClick: () => mount('modal-mount',null)}, '✕')
      ),
      r('p', {style:{fontSize:'.84rem', color:'var(--text3)', marginBottom:18, fontWeight:600}},
        'Drop any file, paste text, or upload a photo — AI extracts and imports events automatically.'
      ),
      r('div', {id:'ai-modal-body'})
    )
  );
  mount('modal-mount', modal);
  refreshAiModal();
}

function parseTextToEvents(text) {
  // Simulate AI parsing with regex heuristics
  const events = [];
  const monthNames = 'Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec|January|February|March|April|May|June|July|August|September|October|November|December';
  const datePattern = new RegExp(`(${monthNames})\\s+(\\d{1,2})(?:,?\\s*(\\d{4}))?`, 'gi');
  const timePattern = /(\d{1,2}):(\d{2})\s*(AM|PM)/gi;
  const lines = text.split('\n').filter(l => l.trim());

  lines.forEach(line => {
    const hasDate = datePattern.test(line);
    datePattern.lastIndex = 0;
    const timeMatch = timePattern.exec(line);
    timePattern.lastIndex = 0;

    if(hasDate || timeMatch) {
      // Extract date
      let dateStr = todayStr();
      const dm = datePattern.exec(line);
      datePattern.lastIndex = 0;
      if(dm) {
        const months = {Jan:1,Feb:2,Mar:3,Apr:4,May:5,Jun:6,Jul:7,Aug:8,Sep:9,Oct:10,Nov:11,Dec:12,
          January:1,February:2,March:3,April:4,May:5,June:6,July:7,August:8,September:9,October:10,November:11,December:12};
        const m = months[dm[1]] || months[dm[1].slice(0,3)];
        const d = parseInt(dm[2]);
        const y = dm[3] ? parseInt(dm[3]) : new Date().getFullYear();
        if(m && d) dateStr = `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      }

      // Extract time
      let timeStr = '';
      if(timeMatch) {
        let h = parseInt(timeMatch[1]);
        const mm = timeMatch[2];
        const ampm = timeMatch[3].toUpperCase();
        if(ampm === 'PM' && h !== 12) h += 12;
        if(ampm === 'AM' && h === 12) h = 0;
        timeStr = `${String(h).padStart(2,'0')}:${mm}`;
      }

      // Extract title (first non-date/time word chunk)
      let title = line.replace(/\d{1,2}:\d{2}\s*(AM|PM)/gi, '').replace(datePattern, '').trim();
      title = title.replace(/^[-:·,]+/, '').trim();
      if(title.length > 50) title = title.slice(0, 50) + '...';
      if(!title) return;

      // Extract location
      const locMatch = line.match(/(?:at|@)\s+([A-Z][^,\n]+)/i);
      const loc = locMatch ? locMatch[1].trim() : '';

      events.push({ title, date: dateStr, time: timeStr, loc });
    }
  });
  return events;
}

// ── MEAL PLANNER BUILDER ──
function buildMealPlannerView() {
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const slots = ['breakfast','lunch','dinner'];
  const slotIcons = { breakfast:'☀️', lunch:'🌤️', dinner:'🌙' };

  // Init meal plan: Sheet data wins; light demo samples otherwise
  if(!Object.keys(S.mealPlan).length) {
    const _wsD = new Date(); _wsD.setDate(_wsD.getDate() - _wsD.getDay());
    const _ws = localDateStr(_wsD);
    const fromSheet = (S.meals || []).filter(m => m.week_start === _ws);
    if(fromSheet.length){
      fromSheet.forEach(m => {
        if(!S.mealPlan[m.day]) S.mealPlan[m.day] = {};
        S.mealPlan[m.day][m.slot] = m.meal;
      });
    } else if(CONFIG.DEMO_MODE){
      // A couple of sample dinners so the planner isn't empty on first open
      const todayIdx = new Date().getDay();
      S.mealPlan[days[todayIdx]] = { dinner: DEMO_MEALS.dinner[0] };
      S.mealPlan[days[(todayIdx+1)%7]] = { dinner: DEMO_MEALS.dinner[3] };
    }
  }

  function refreshMealView() {
    const wrap = document.getElementById('meal-planner-inner');
    if(!wrap) return;
    wrap.innerHTML = '';

    const tabRow = r('div', {class:'tab-row'},
      r('button', {class:`tab-btn${S.mealTab==='planner'?' on':''}`, onClick:()=>{S.mealTab='planner';refreshMealView()}}, '📅 Planner'),
      r('button', {class:`tab-btn${S.mealTab==='recipes'?' on':''}`, onClick:()=>{S.mealTab='recipes';refreshMealView()}}, '📖 Recipes'),
      r('button', {class:`tab-btn${S.mealTab==='grocery'?' on':''}`, onClick:()=>{S.mealTab='grocery';refreshMealView()}}, '🛒 Shopping'),
    );
    wrap.appendChild(tabRow);

    // Compute the week start for this plan (use Sunday of current week)
    const _wsDate = new Date(); _wsDate.setDate(_wsDate.getDate() - _wsDate.getDay());
    const _weekStart = localDateStr(_wsDate);

    async function saveMealPlanToSheet() {
      setSyncStatus('syncing');
      try {
        await API.saveMealPlan(S.mealPlan, _weekStart);
        setSyncStatus('synced');
        showToast('📅 Meal plan saved to Sheet!');
      } catch(e) { setSyncStatus('error'); showToast('Sync failed: ' + e.message, false); }
    }

    if(S.mealTab === 'planner') {
      // Load meals from sheet data on first open
      if(!Object.keys(S.mealPlan).length && S.meals && S.meals.length) {
        const thisMeals = S.meals.filter(m => m.week_start === _weekStart);
        thisMeals.forEach(m => {
          if(!S.mealPlan[m.day]) S.mealPlan[m.day] = {};
          S.mealPlan[m.day][m.slot] = m.meal;
        });
      }

      // AI generate button
      const aiBtn = r('button', {class:'btn btn-accent', style:{marginBottom:6, width:'100%'},
        onClick: async () => {
          days.forEach(day => {
            S.mealPlan[day] = {
              breakfast: DEMO_MEALS.breakfast[Math.floor(Math.random() * DEMO_MEALS.breakfast.length)],
              lunch: DEMO_MEALS.lunch[Math.floor(Math.random() * DEMO_MEALS.lunch.length)],
              dinner: DEMO_MEALS.dinner[Math.floor(Math.random() * DEMO_MEALS.dinner.length)],
            };
          });
          refreshMealView();
          await saveMealPlanToSheet();
        }
      }, '🎲 Auto-Fill Week with Suggestions');
      wrap.appendChild(aiBtn);

      // Save button
      const saveBtn = r('button', {class:'btn btn-secondary', style:{marginBottom:14, width:'100%', fontSize:'.78rem'},
        onClick: saveMealPlanToSheet
      }, '☁️ Save Plan to Sheet');
      wrap.appendChild(saveBtn);


      const grid = r('div', {class:'meal-week-grid'});
      days.forEach(day => {
        const dayCard = r('div', {class:'meal-day-card'},
          r('div', {class:'meal-day-name'}, day)
        );
        slots.forEach(slot => {
          const meal = S.mealPlan[day]?.[slot] || '';
          const slotEl = r('div', {
            class:`meal-slot${meal?' filled':''}`,
            onClick: () => openMealPicker(day, slot, async () => {
              refreshMealView();
              await saveMealPlanToSheet();
            })
          },
            r('div', {style:{width:'100%'}},
              r('div', {class:'meal-slot-label'}, slotIcons[slot] + ' ' + slot),
              meal ? r('div', {style:{lineHeight:1.3}}, meal) :
                r('div', {style:{color:'var(--text3)', fontSize:'.65rem'}}, 'Tap to add')
            )
          );
          dayCard.appendChild(slotEl);
        });
        grid.appendChild(dayCard);
      });
      wrap.appendChild(grid);

    } else if(S.mealTab === 'recipes') {
      const recipeGrid = r('div', {style:{display:'grid', gridTemplateColumns:'repeat(auto-fill,minmax(260px,1fr))', gap:12}});
      RECIPES.forEach(rec => {
        const card = r('div', {class:'recipe-card'},
          r('div', {class:'recipe-emoji'}, rec.emoji),
          r('div', {class:'recipe-name'}, rec.name),
          r('div', {class:'recipe-tags'},
            ...rec.tags.map(t => r('span', {class:'recipe-tag'}, t)),
            r('span', {class:'recipe-tag'}, `⏱ ${rec.time}`),
            r('span', {class:'recipe-tag'}, `👤 ${rec.serves}`)
          ),
          r('div', {style:{fontSize:'.78rem', color:'var(--text3)', marginBottom:12}},
            rec.ingredients.slice(0,4).join(', ') + (rec.ingredients.length > 4 ? ', ...' : '')
          ),
          r('button', {class:'btn btn-secondary', style:{fontSize:'.75rem', padding:'6px 14px'},
            onClick: () => openRecipePlanPicker(rec, async () => {
              S.mealTab = 'planner';
              refreshMealView();
              await saveMealPlanToSheet();
            })
          }, 'Add to Plan')
        );
        recipeGrid.appendChild(card);
      });
      wrap.appendChild(recipeGrid);

    } else {
      // Grocery / Shopping
      buildGroceryInner(wrap);
    }
  }

  const outer = r('div', {class:'anim-in'},
    r('div', {class:'sh', style:{marginTop:4}},
      r('div', {class:'sh-title'}, '🍽️ Meal Planner'),
      r('button', {class:'btn btn-accent', style:{padding:'5px 12px', fontSize:'.75rem'},
        onClick: openAiImportModal
      }, '✨ Import')
    ),
    r('div', {id:'meal-planner-inner'})
  );
  setTimeout(refreshMealView, 0);
  return outer;
}

function buildGroceryInner(wrap) {
  // Seed from sheet data (S.groceryItems loaded from readAll) or demo
  if(!S.groceryItems.length) {
    S.groceryItems = (S.grocery && S.grocery.length)
      ? S.grocery.map(g => ({...g, item_id: g.item_id||('g'+Date.now()+Math.random()), checked: g.checked===true||g.checked==='TRUE'||g.checked==='true'}))
      : GROCERY_DEMO.map(i => ({...i}));
  }

  let _grocerySaveTimer = null;
  function scheduleGrocerySave() {
    if(_grocerySaveTimer) clearTimeout(_grocerySaveTimer);
    // Debounce: save 1.5s after last change
    _grocerySaveTimer = setTimeout(async () => {
      try {
        await API.syncGrocery(S.groceryItems.map(item => ({
          item_id: item.item_id || item.id || ('g'+Date.now()),
          name: item.name, qty: item.qty || '', cat: item.cat || '🛒 Other',
          checked: item.checked ? 'TRUE' : 'FALSE',
          added_by: S.currentUser?.user_id || '', added_at: item.added_at || new Date().toISOString(),
        })));
        setSyncStatus('synced');
      } catch(e) { setSyncStatus('error'); }
    }, 1500);
  }

  function refreshGrocery() {
    const gInner = document.getElementById('grocery-inner');
    if(!gInner) return;
    gInner.innerHTML = '';

    const total = S.groceryItems.length;
    const checked = S.groceryItems.filter(i => i.checked).length;

    const summary = r('div', {style:{display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:16}},
      r('div', {style:{fontSize:'.85rem', fontWeight:700, color:'var(--text3)'}},
        `${checked}/${total} items checked`
      ),
      r('div', {class:'pbar-wrap', style:{flex:1, margin:'0 12px'}},
        r('div', {class:'pbar-fill', style:{width:`${total?Math.round(checked/total*100):0}%`, background:'var(--green)'}})
      ),
      r('button', {class:'btn btn-primary', style:{fontSize:'.72rem', padding:'4px 12px'},
        onClick: () => openGroceryAddModal(item => {
          S.groceryItems.push(item);
          scheduleGrocerySave();
          refreshGrocery();
        })
      }, '+ Add Item')
    );
    gInner.appendChild(summary);

    const catGroups = {};
    S.groceryItems.forEach(item => {
      if(!catGroups[item.cat]) catGroups[item.cat] = [];
      catGroups[item.cat].push(item);
    });

    Object.entries(catGroups).forEach(([cat, items]) => {
      const sec = r('div', {class:'grocery-section'},
        r('div', {class:'grocery-section-title'}, cat)
      );
      items.forEach(item => {
        const checkEl = r('div', {class:`grocery-check${item.checked?' on':''}`,
          onClick: () => {
            item.checked = !item.checked;
            setSyncStatus('syncing');
            scheduleGrocerySave();
            refreshGrocery();
          }
        }, item.checked ? '✓' : '');
        const delBtn = r('button', {
          style:{background:'none',border:'none',color:'var(--text3)',cursor:'pointer',fontSize:'14px',padding:'0 4px',opacity:.5},
          title:'Remove',
          onClick: async () => {
            S.groceryItems = S.groceryItems.filter(g => g !== item);
            scheduleGrocerySave();
            refreshGrocery();
          }
        }, '✕');
        const sec2 = r('div', {class:'grocery-item'},
          checkEl,
          r('div', {class:`grocery-name${item.checked?' checked':''}`, contentEditable:true, spellCheck:false,
            onBlur: e => {
              item.name = e.target.textContent.trim();
              scheduleGrocerySave();
            }
          }, item.name),
          r('div', {class:'grocery-qty'}, item.qty),
          delBtn
        );
        sec.appendChild(sec2);
      });
      gInner.appendChild(sec);
    });

    // Sync now + generate-from-meal-plan buttons
    gInner.appendChild(r('div', {style:{display:'flex', gap:8, marginTop:16}},
      r('button', {class:'btn btn-secondary', style:{flex:1, fontSize:'.78rem'},
        onClick: () => {
          const added = groceryFromMealPlan();
          if(added){ scheduleGrocerySave(); refreshGrocery(); showToast(`🍽️ Added ${added} ingredients from this week's meals`); }
          else showToast('No new ingredients found — plan meals from the Recipes tab first');
        }
      }, '🍽️ From Meal Plan'),
      r('button', {class:'btn btn-secondary', style:{flex:1, fontSize:'.78rem'},
        onClick: async () => {
          setSyncStatus('syncing');
          try {
            await API.syncGrocery(S.groceryItems.map(item => ({
              item_id: item.item_id || item.id || ('g'+Date.now()),
              name: item.name, qty: item.qty || '', cat: item.cat || '🛒 Other',
              checked: item.checked ? 'TRUE' : 'FALSE',
              added_by: S.currentUser?.user_id || '', added_at: item.added_at || new Date().toISOString(),
            })));
            setSyncStatus('synced');
            showToast('🛒 Grocery list saved to Sheet!');
          } catch(e) { setSyncStatus('error'); showToast('Sync failed: ' + e.message, false); }
        }
      }, '☁️ Save to Sheet')
    ));

    // Copy the open items — paste into any store app, text message, etc.
    gInner.appendChild(
      r('div', {style:{marginTop:8}},
        r('button', {class:'instacart-btn',
          onClick: () => {
            const open = S.groceryItems.filter(i => !i.checked);
            if(!open.length){ showToast('Nothing left to buy! 🎉'); return; }
            const text = '🛒 Shopping List\n' + open.map(i => `• ${i.name}${i.qty?' ('+i.qty+')':''}`).join('\n');
            const copied = () => showToast(`📋 ${open.length} items copied — paste anywhere!`);
            if(navigator.clipboard && navigator.clipboard.writeText){
              navigator.clipboard.writeText(text).then(copied).catch(()=>{
                showToast('Copy blocked by browser — long-press to select instead', false);
              });
            } else { showToast('Clipboard not available in this browser', false); }
          }
        }, '📋', 'Copy Shopping List'),
        r('div', {style:{textAlign:'center', fontSize:'.72rem', color:'var(--text3)', marginTop:8, fontWeight:600}},
          `${total - checked} items still to buy`
        )
      )
    );
  }

  wrap.appendChild(r('div', {id:'grocery-inner'}));
  setTimeout(refreshGrocery, 0);
}

// ── ENHANCED REWARDS VIEW ──
function buildRewardsEnhanced() {
  function refreshRewards() {
    const wrap = document.getElementById('rewards-inner');
    if(!wrap) return;
    wrap.innerHTML = '';

    const tabRow = r('div', {class:'tab-row'},
      r('button', {class:`tab-btn${S.rewardsTab==='leaderboard'?' on':''}`, onClick:()=>{S.rewardsTab='leaderboard';refreshRewards()}}, '🏆 Leaderboard'),
      r('button', {class:`tab-btn${S.rewardsTab==='badges'?' on':''}`, onClick:()=>{S.rewardsTab='badges';refreshRewards()}}, '🎖️ Badges'),
      r('button', {class:`tab-btn${S.rewardsTab==='history'?' on':''}`, onClick:()=>{S.rewardsTab='history';refreshRewards()}}, '📋 History'),
    );
    wrap.appendChild(tabRow);

    if(S.rewardsTab === 'leaderboard') {
      const kids = S.users.filter(u => u.role === 'child');
      const scored = kids.map(u => ({u, pts: userPoints(u.user_id)})).sort((a,b) => b.pts - a.pts);

      if(scored.length) {
        const top = scored[0];
        // Banner for top scorer
        wrap.appendChild(r('div', {class:'score-banner', style:{marginBottom:16}},
          r('div', {},
            r('div', {style:{fontFamily:'var(--serif)', fontStyle:'italic', fontSize:'1rem', marginBottom:6, opacity:.7}}, '⭐ Top Scorer'),
            r('div', {style:{fontFamily:'var(--serif)', fontStyle:'italic', fontSize:'1.6rem', fontWeight:400}}, top.u.avatar + ' ' + top.u.name),
            r('div', {style:{fontSize:'2.4rem', fontWeight:900, fontFamily:'var(--serif)', fontStyle:'italic', marginTop:4}}, top.pts + ' ⭐'),
          ),
          r('div', {style:{fontSize:'3rem'}}, '👑')
        ));
      }

      scored.forEach((item, i) => {
        const maxPts = scored[0]?.pts || 1;
        const pct = maxPts ? Math.round(item.pts / maxPts * 100) : 0;
        const medals = ['🥇','🥈','🥉'];
        wrap.appendChild(r('div', {class:'lb-item'},
          r('div', {class:'lb-rank'}, medals[i] || `#${i+1}`),
          r('div', {class:'av av-lg', style:{color:item.u.color, background:item.u.color+'22', border:'2px solid '+item.u.color, flexShrink:0}}, item.u.avatar),
          r('div', {style:{flex:1}},
            r('div', {style:{fontWeight:700, fontSize:'.92rem', marginBottom:4}}, item.u.name),
            r('div', {class:'lb-bar'},
              r('div', {style:{height:'100%', width:pct+'%', background:item.u.color, borderRadius:99, transition:'width .8s'}})
            ),
            r('div', {class:'lb-stars-row'},
              ...Array.from({length:Math.min(5,Math.floor(item.pts/10))}, () => r('span', {class:'lb-star'}, '⭐'))
            )
          ),
          r('div', {class:'pts-pill'},
            r('span', {class:'pts-num'}, item.pts),
            ' ⭐'
          )
        ));
      });

      // Also show parents
      const parents = S.users.filter(u => u.role === 'parent');
      if(parents.length) {
        wrap.appendChild(r('div', {style:{fontSize:'.72rem', fontWeight:800, letterSpacing:'.08em', textTransform:'uppercase', color:'var(--text3)', margin:'18px 0 10px'}}, 'Parents'));
        parents.forEach(u => {
          const tasks = S.tasks.filter(t => t.assigned_to===u.user_id && t.status==='completed').length;
          wrap.appendChild(r('div', {class:'lb-item'},
            r('div', {class:'av av-md', style:{color:u.color, background:u.color+'22'}}, u.avatar),
            r('div', {style:{flex:1, fontWeight:600}}, u.name),
            r('div', {style:{fontSize:'.78rem', color:'var(--text3)', fontWeight:600}}, `${tasks} tasks ✅`)
          ));
        });
      }

      // Add stars button (admin only)
      if(S.isAdmin) {
        wrap.appendChild(r('button', {class:'btn btn-accent', style:{width:'100%', marginTop:16},
          onClick: () => {
            const kids2 = S.users.filter(u => u.role === 'child');
            if(!kids2.length) return;
            const kid = kids2[0];
            DEMO.rewards.push({reward_id:'rw'+Date.now(), user_id:kid.user_id, points:5, reason:'Bonus Stars', date:todayStr()});
            S.rewards = [...DEMO.rewards];
            launchConfetti();
            launchStarBurst();
            showToast(`⭐ +5 stars for ${kid.name}!`);
            refreshRewards();
          }
        }, '⭐ Award Bonus Stars'));
      }

    } else if(S.rewardsTab === 'badges') {
      const kids = S.users.filter(u => u.role === 'child');
      if(kids.length) {
        const kid = kids[0];
        const pts = userPoints(kid.user_id);
        wrap.appendChild(r('div', {style:{display:'flex', alignItems:'center', gap:12, marginBottom:16, padding:'14px 16px', background:'var(--s2)', borderRadius:'var(--rsm)'}},
          r('div', {class:'av av-lg', style:{color:kid.color, background:kid.color+'22'}}, kid.avatar),
          r('div', {},
            r('div', {style:{fontWeight:700}}, kid.name + "'s Achievements"),
            r('div', {style:{fontSize:'.82rem', color:'var(--text3)', marginTop:3}}, `${pts} ⭐ total earned`)
          )
        ));
      }

      const grid = r('div', {style:{display:'grid', gridTemplateColumns:'repeat(auto-fill,minmax(130px,1fr))', gap:10}});
      ACHIEVEMENTS.forEach(a => {
        const userPts = kids.length ? userPoints(kids[0]?.user_id) : 0;
        const unlocked = a.unlocked || (a.pts && userPts >= a.pts);
        const card = r('div', {class:`achievement-badge${unlocked?'':' locked'}`},
          r('div', {class:'badge-ico'}, a.ico),
          r('div', {class:'badge-name'}, a.name),
          r('div', {class:'badge-req'}, a.req),
          unlocked ? r('div', {class:'badge-unlock'}, '✓ Unlocked') : null
        );
        grid.appendChild(card);
      });
      wrap.appendChild(grid);

    } else {
      // History
      const history = [...S.rewards].reverse();
      if(!history.length) {
        wrap.appendChild(r('div', {class:'empty'},
          r('div', {class:'empty-ico'}, '⭐'),
          r('div', {class:'empty-title'}, 'No rewards yet'),
          r('div', {}, 'Complete tasks to earn stars!')
        ));
        return;
      }
      history.forEach(rw => {
        const u = getUser(rw.user_id);
        wrap.appendChild(r('div', {class:'tcard', style:{gap:10, padding:'12px 14px'}},
          r('div', {style:{fontSize:'1.4rem'}}, '⭐'),
          r('div', {style:{flex:1}},
            r('div', {style:{fontWeight:700, fontSize:'.88rem'}}, rw.reason),
            r('div', {style:{fontSize:'.74rem', color:'var(--text3)', marginTop:3}},
              (u ? u.avatar + ' ' + u.name + ' · ' : '') + fmtDate(rw.date)
            )
          ),
          r('div', {class:'pts-pill', style:{padding:'4px 10px'}},
            r('span', {class:'pts-num'}, '+' + rw.points),
            ' ⭐'
          )
        ));
      });
    }
  }

  const outer = r('div', {class:'anim-in'},
    r('div', {class:'sh', style:{marginTop:4}},
      r('div', {class:'sh-title'}, '⭐ Rewards'),
      null
    ),
    r('div', {id:'rewards-inner'})
  );
  setTimeout(refreshRewards, 0);
  return outer;
}

// ── PATCH renderContent for new tabs ──
const _origRenderContent = renderContent;
renderContent = function() {
  // Kid mode check (keep original)
  if(S.currentUser && S.currentUser.role==='child' && !S.isAdmin && S.activeTab!=='rewards') {
    // Kids see a simplified two-tab view: their tasks + rewards.
    // Settings and everything else require Parent Mode (PIN in the top bar).
    if(S.activeTab==='settings') S.activeTab='home';
    mount('content', buildKidMode());
    const nav = r('nav', {class:'bottomnav'},
      r('button', {class:`navitem${S.activeTab==='home'?' on':''}`, onClick:()=>{S.activeTab='home';renderContent()}}, r('span',{class:'navico'},'🏠'), 'My Tasks'),

    );
    mount('bottomnav-mount', nav);
    const existingFab = document.querySelector('.fab'); if(existingFab) existingFab.remove();
    return;
  }

  let view;
  switch(S.activeTab) {
    case 'home':     view = buildHome(); break;
    case 'tasks':    view = buildTasks(); break;
    case 'calendar': view = buildCalendarFull(); break;
    case 'routines': view = buildRoutines(); break;
    case 'meals':    view = buildMealPlannerView(); break;
    case 'rewards':  view = buildRewardsEnhanced(); break;
    case 'settings': view = buildSettings(); break;
    default:         view = buildHome();
  }
  mount('content', view);
  renderBottomNav();

  const existingFab = document.querySelector('.fab'); if(existingFab) existingFab.remove();
  if(S.isAdmin && (S.activeTab==='home'||S.activeTab==='tasks')) {
    const fabItems = [
      r('button', {class:'fab', style:{position:'fixed',bottom:96,right:22,zIndex:200},

            position:'fixed', bottom:166, right:22, zIndex:201,
            background:'var(--surface)', border:'1px solid var(--border)',
            borderRadius:'var(--r)', padding:10, display:'flex',
            flexDirection:'column', gap:6, boxShadow:'var(--sh-3)',
            animation:'slideUp .2s var(--ease)'
          }},
            r('button', {class:'btn btn-primary', style:{width:'100%'},

            r('button', {class:'btn btn-secondary', style:{width:'100%'},
              onClick:()=>{m.remove();openEventModal();}
            }, '📅 New Event'),
            r('button', {class:'btn btn-secondary', style:{width:'100%'},
              onClick:()=>{m.remove();openAiImportModal();}
            }, '✨ AI Import')
          );
          document.getElementById('app').appendChild(m);
        }
      }, '+')
    ];
    document.getElementById('app').appendChild(fabItems[0]);
  }
