// ── PATCH buildHome to include weather ──
const _origBuildHome = buildHome;
buildHome = function() {
  const base = _origBuildHome();

  // After base is built, we'll inject weather below the hero
  // Actually return enhanced version
  const td = todayStr();
  const now = new Date();
  const hour = now.getHours();
  const greeting = hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';
  const famName = (S.settings && S.settings.family_name) || 'the Family';
  const user = S.currentUser;

  const todayTasks = S.tasks.filter(t => normDate(t.due_date) === td);
  const done = todayTasks.filter(t => t.status === 'completed').length;
  const overdue = S.tasks.filter(t => isOverdue(t)).length;
  const todayEvts = S.events.filter(e => normDate(e.start_date) === td).sort((a,b) => (a.start_time||'') < (b.start_time||'') ? -1 : 1);

  // Weather strip for hero
  const w = S.weather;
  const heroWeather = w ? r('div', {class:'hero-weather'},
    r('span', {style:{fontSize:'1.6rem'}}, w.ico),
    r('div', {class:'hero-weather-temp'}, `${w.temp}°F`),
    r('div', {class:'hero-weather-desc'}, `${w.desc} · ${w.location}`),
    r('div', {style:{marginLeft:'auto'}}, getSyncEl())
  ) : null;

  const heroStats = [
    r('div', {class:'stat-chip'},
      r('div', {class:'chip-dot'}),
      r('span', {class:'chip-num'}, `${done}/${todayTasks.length}`),
      ' tasks today'
    ),
    overdue > 0 ? r('div', {class:'stat-chip warn'},
      r('div', {class:'chip-dot'}),
      r('span', {class:'chip-num'}, overdue),
      ' overdue'
    ) : null,
    r('div', {class:'stat-chip'},
      r('div', {class:'chip-dot'}),
      r('span', {class:'chip-num'}, todayEvts.length),
      ' events'
    ),
  ];

  const hero = r('div', {class:'hero'},
    r('div', {class:'hero-ornament'}),
    r('div', {class:'hero-eyebrow'}, now.toLocaleDateString([], {weekday:'long', month:'long', day:'numeric'})),
    r('div', {class:'hero-greet'},
      greeting + ', ',
      r('em', {}, user ? user.name : famName),
      '.'
    ),
    r('div', {class:'hero-sub'}, `Here's what's on your plate today — ${todayTasks.length} task${todayTasks.length!==1?'s':''} and ${todayEvts.length} event${todayEvts.length!==1?'s':''} scheduled.`),
    r('div', {class:'hero-stats'}, ...heroStats.filter(Boolean)),
    heroWeather
  );

  // Quick action buttons
  const quickActions = r('div', {style:{display:'flex', gap:8, marginBottom:18, flexWrap:'wrap'}},
    r('button', {class:'btn btn-secondary', style:{fontSize:'.78rem'},
      onClick: openAiImportModal
    }, '✨ AI Import'),
    r('button', {class:'btn btn-secondary', style:{fontSize:'.78rem'},
      onClick: () => { S.activeTab='meals'; renderContent(); }
    }, '🍽️ Meals'),
    r('button', {class:'btn btn-secondary', style:{fontSize:'.78rem'},
      onClick: () => { S.activeTab='rewards'; renderContent(); }
    }, '⭐ Rewards'),
    r('button', {class:'btn btn-secondary', style:{fontSize:'.78rem'},
      onClick: () => { S.notifications=[...DEMO_NOTIFS]; openNotifDrawer(); }
    }, `🔔 ${DEMO_NOTIFS.filter(n=>n.unread).length}`)
  );

  // Weather widget (compact)
  const weatherWidget = buildWeatherWidget();
  weatherWidget.style.marginBottom = '18px';

  const wrap = r('div', {class:'anim-in'},
    hero, quickActions, weatherWidget
  );

  // Today's events section
  if(todayEvts.length) {
    wrap.appendChild(r('div', {class:'sh'},
      r('div', {class:'sh-title'}, 'Today'),
      null
    ));
    todayEvts.forEach(ev => {
      const u = ev.assigned_to ? getUser(ev.assigned_to) : null;
      const evCard = r('div', {class:'agenda-item'},
        r('div', {class:'agenda-time-col'}, ev.start_time ? fmt12(ev.start_time) : 'All day'),
        r('div', {class:'agenda-body'},
          r('div', {class:'agenda-title'},
            r('span', {style:{display:'inline-block', width:10, height:10, borderRadius:'50%', background:ev.color||'var(--accent)', marginRight:6}}),
            ev.title
          ),
          u ? r('div', {class:'agenda-meta'}, u.avatar + ' ' + u.name) : null
        )
      );
      wrap.appendChild(evCard);
    });
  }

  // Today's tasks section
  const todayPendingTasks = todayTasks.filter(t => t.status === 'pending').slice(0, 5);
  if(todayPendingTasks.length) {
    wrap.appendChild(r('div', {class:'sh'},
      r('div', {class:'sh-title'}, 'Tasks Today'),
      r('button', {class:'btn btn-ghost', style:{fontSize:'.78rem'},
        onClick:()=>{S.activeTab='tasks';renderContent();}
      }, 'See all')
    ));
    todayPendingTasks.forEach(t => wrap.appendChild(buildTaskCard(t)));
  }

  // Mini calendar
  wrap.appendChild(r('div', {class:'sh'},
    r('div', {class:'sh-title'}, 'This Week'),
    r('button', {class:'btn btn-ghost', style:{fontSize:'.78rem'},
      onClick:()=>{S.activeTab='calendar';renderContent();}
    }, 'Full View')
  ));
  wrap.appendChild(buildDashboardCalendar());

  return wrap;
};

// ── NOTIFICATION DRAWER ──
function openNotifDrawer() {
  if(!S.notifications.length) S.notifications = [...DEMO_NOTIFS];
  const modal = r('div', {class:'modal-bg', onClick:e=>{if(e.target===e.currentTarget)mount('modal-mount',null)}},
    r('div', {class:'modal'},
      r('div', {class:'modal-hdr'},
        r('div', {class:'modal-title'}, '🔔 Notifications'),
        r('button', {class:'modal-close', onClick:()=>mount('modal-mount',null)}, '✕')
      ),
      ...S.notifications.map(n => r('div', {
        class:`notif-item${n.unread?' unread':''}`,
        onClick:()=>{n.unread=false;mount('modal-mount',null);}
      },
        r('div', {class:'notif-ico'}, n.ico),
        r('div', {class:'notif-body'},
          r('div', {class:'notif-msg'}, n.msg),
          r('div', {class:'notif-time'}, n.time)
        )
      ))
    )
  );
  mount('modal-mount', modal);
}


// ═══════════════════════════════════════════════════════════════
// MEAL PICKER — tap a slot, type a meal or pick a suggestion
// ═══════════════════════════════════════════════════════════════
function openMealPicker(day, slot, onDone){
  const current = (S.mealPlan[day] && S.mealPlan[day][slot]) || '';
  let value = current;
  const input = r('input',{class:'finput',placeholder:'Type a meal… e.g. Taco Night',value:current,
    onInput:e=>{ value=e.target.value; }});
  const suggestions = [
    ...DEMO_MEALS[slot],
    ...RECIPES.map(rc=>rc.emoji+' '+rc.name),
  ];
  const chipWrap = r('div',{style:{display:'flex',flexWrap:'wrap',gap:6,marginTop:10,maxHeight:'150px',overflowY:'auto'}},
    ...suggestions.map(sug=>r('button',{class:'meal-sug-chip',
      onClick:()=>{ value=sug; input.value=sug; }},sug))
  );
  function commit(v){
    S.mealPlan[day] = S.mealPlan[day] || {};
    if(v && v.trim()) S.mealPlan[day][slot] = v.trim();
    else delete S.mealPlan[day][slot];
    mount('modal-mount',null);
    onDone && onDone();
  }
  const modal = r('div',{class:'modal-bg',onClick:e=>{if(e.target===e.currentTarget)mount('modal-mount',null)}},
    r('div',{class:'modal',role:'dialog','aria-label':'Choose meal'},
      r('div',{class:'modal-hdr'},
        r('div',{class:'modal-title'},'🍽️ '+day+' — '+slot.charAt(0).toUpperCase()+slot.slice(1)),
        r('button',{class:'modal-close','aria-label':'Close',onClick:()=>mount('modal-mount',null)},'✕')
      ),
      r('div',{class:'fgroup'},r('label',{class:'flabel'},'Meal'),input),
      r('div',{style:{fontSize:'.72rem',fontWeight:700,color:'var(--text3)',marginTop:4}},'Suggestions'),
      chipWrap,
      r('div',{style:{display:'flex',gap:10,marginTop:14}},
        current ? r('button',{class:'btn btn-secondary',style:{color:'var(--red)'},
          onClick:()=>commit('')},'Clear') : null,
        r('button',{class:'btn btn-secondary',style:{flex:1},onClick:()=>mount('modal-mount',null)},'Cancel'),
        r('button',{class:'btn btn-primary',style:{flex:2},onClick:()=>commit(value)},'Save')
      )
    )
  );
  mount('modal-mount',modal);
  setTimeout(()=>input.focus(),50);
}

// ═══════════════════════════════════════════════════════════════
// RECIPE → PLAN PICKER — choose which day + slot a recipe goes to
// ═══════════════════════════════════════════════════════════════
function openRecipePlanPicker(rec, onDone){
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  let selDay = days[new Date().getDay()], selSlot = 'dinner';
  function chipRow(items, getSel, setSel){
    const rowEl = r('div',{style:{display:'flex',flexWrap:'wrap',gap:6,marginTop:6}});
    items.forEach(it=>{
      const b=r('button',{class:'meal-sug-chip'+(getSel()===it?' on':''),
        onClick:()=>{ setSel(it); [...rowEl.children].forEach(c=>c.classList.remove('on')); b.classList.add('on'); }},it);
      rowEl.appendChild(b);
    });
    return rowEl;
  }
  const modal = r('div',{class:'modal-bg',onClick:e=>{if(e.target===e.currentTarget)mount('modal-mount',null)}},
    r('div',{class:'modal',role:'dialog','aria-label':'Add recipe to plan'},
      r('div',{class:'modal-hdr'},
        r('div',{class:'modal-title'},rec.emoji+' '+rec.name),
        r('button',{class:'modal-close','aria-label':'Close',onClick:()=>mount('modal-mount',null)},'✕')
      ),
      r('div',{style:{fontSize:'.72rem',fontWeight:700,color:'var(--text3)'}},'Day'),
      chipRow(days, ()=>selDay, v=>selDay=v),
      r('div',{style:{fontSize:'.72rem',fontWeight:700,color:'var(--text3)',marginTop:12}},'Meal'),
      chipRow(['breakfast','lunch','dinner'], ()=>selSlot, v=>selSlot=v),
      r('div',{style:{display:'flex',gap:10,marginTop:16}},
        r('button',{class:'btn btn-secondary',style:{flex:1},onClick:()=>mount('modal-mount',null)},'Cancel'),
        r('button',{class:'btn btn-primary',style:{flex:2},onClick:()=>{
          S.mealPlan[selDay] = S.mealPlan[selDay] || {};
          S.mealPlan[selDay][selSlot] = rec.emoji+' '+rec.name;
          mount('modal-mount',null);
          showToast('📅 '+rec.name+' planned for '+selDay+' '+selSlot);
          onDone && onDone();
        }},'Add to Plan')
      )
    )
  );
  mount('modal-mount',modal);
}

// ═══════════════════════════════════════════════════════════════
// GROCERY ADD MODAL
// ═══════════════════════════════════════════════════════════════
function openGroceryAddModal(onAdd){
  const cats = ['🥦 Produce','🥛 Dairy','🥩 Meat','🥫 Pantry','🧊 Frozen','🧴 Household','🛒 Other'];
  let form = { name:'', qty:'', cat:'🛒 Other' };
  const nameInput = r('input',{class:'finput',placeholder:'e.g. Bananas',onInput:e=>form.name=e.target.value});
  const qtyInput  = r('input',{class:'finput',placeholder:'e.g. 1 bunch (optional)',onInput:e=>form.qty=e.target.value});
  const catSelect = r('select',{class:'fselect',onInput:e=>form.cat=e.target.value},
    ...cats.map(c=>{ const o=r('option',{value:c},c); if(c===form.cat)o.selected=true; return o; }));
  function submit(){
    if(!form.name.trim()){ showToast('Give the item a name',false); nameInput.focus(); return; }
    onAdd({
      item_id:'g'+Date.now(), name:form.name.trim(), qty:form.qty.trim(),
      cat:form.cat, checked:false,
      added_by:S.currentUser?.user_id||'', added_at:new Date().toISOString(),
    });
    mount('modal-mount',null);
    showToast('🛒 Added '+form.name.trim());
  }
  const modal = r('div',{class:'modal-bg',onClick:e=>{if(e.target===e.currentTarget)mount('modal-mount',null)}},
    r('div',{class:'modal',role:'dialog','aria-label':'Add grocery item'},
      r('div',{class:'modal-hdr'},
        r('div',{class:'modal-title'},'🛒 Add Grocery Item'),
        r('button',{class:'modal-close','aria-label':'Close',onClick:()=>mount('modal-mount',null)},'✕')
      ),
      r('div',{class:'fgroup'},r('label',{class:'flabel'},'Item *'),nameInput),
      r('div',{class:'frow'},
        r('div',{class:'fgroup',style:{marginBottom:0}},r('label',{class:'flabel'},'Quantity'),qtyInput),
        r('div',{class:'fgroup',style:{marginBottom:0}},r('label',{class:'flabel'},'Category'),catSelect)
      ),
      r('div',{style:{display:'flex',gap:10,marginTop:14}},
        r('button',{class:'btn btn-secondary',style:{flex:1},onClick:()=>mount('modal-mount',null)},'Cancel'),
        r('button',{class:'btn btn-primary',style:{flex:2},onClick:submit},'Add')
      )
    )
  );
  mount('modal-mount',modal);
  nameInput.addEventListener('keydown',e=>{ if(e.key==='Enter') submit(); });
  setTimeout(()=>nameInput.focus(),50);
}

// ═══════════════════════════════════════════════════════════════
// GROCERY ← MEAL PLAN — pull ingredients for planned recipes
// ═══════════════════════════════════════════════════════════════
function groceryFromMealPlan(){
  const existing = new Set(S.groceryItems.map(i=>i.name.toLowerCase()));
  let added = 0;
  Object.values(S.mealPlan||{}).forEach(slots=>{
    Object.values(slots||{}).forEach(mealName=>{
      if(!mealName) return;
      const plain = String(mealName).replace(/[^\w\s'&-]/g,'').trim().toLowerCase();
      const recipe = RECIPES.find(rc=>plain.includes(rc.name.toLowerCase()));
      if(!recipe) return;
      recipe.ingredients.forEach(ing=>{
        if(existing.has(ing.toLowerCase())) return;
        existing.add(ing.toLowerCase());
        S.groceryItems.push({
          item_id:'g'+Date.now()+Math.floor(Math.random()*1e5),
          name:ing, qty:'', cat:'🥫 Pantry', checked:false,
          added_by:S.currentUser?.user_id||'', added_at:new Date().toISOString(),
        });
        added++;
      });
    });
  });
  return added;
}

// ── FINAL INIT ──
// Re-render to pick up enhanced functions
setTimeout(() => {
  if(!S.loading) renderAll();
}, 100);

</script>
